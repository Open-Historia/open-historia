name: Build Android APK

# Builds the Android app and attaches the APK to the rolling "android" release,
# so players just download and install — no Android SDK needed on anyone's
# machine. Run it from the Actions tab (workflow_dispatch) after changing mobile/
# or the client, or push an android-v* tag.
#
# The app IS the web build: it packages the same bundle openhistoria.com serves
# and connects to a community content node on its own. It used to be a thin
# WebView pointed at a server the player had to run themselves (Termux on the
# phone, or a host on their network), which is why this now builds the client.

on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # VITE_APP_BUILD is what makes the in-app update banner take its APK path:
      # it compares this number against the one in the release manifest and offers
      # the new APK. The web router answers /api/app-update for it, since this
      # build has no on-device server to proxy the manifest any more.
      - name: Build the web client
        env:
          VITE_APP_BUILD: ${{ github.run_number }}
          VITE_APP_TRACK: stable
        run: |
          npm ci
          npm run build:web

      - name: Build the APK
        run: |
          cd mobile
          npm ci
          npm run www
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk pax-historia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pax-historia-apk
          path: pax-historia.apk

      - name: Publish to the rolling "android" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Open Historia for Android. Download pax-historia.apk below and open it to install (allow installs from your browser when Android asks). Nothing else to set up: the app connects to a community content node on its own, the same way openhistoria.com does, and streams the world map from it. No server on your phone, no Termux. It updates itself when a newer build is published here.

          Build: ${{ github.run_number }}"
          gh release create android --title "Android app" --notes "$NOTES" 2>/dev/null \
            || gh release edit android --notes "$NOTES"
          gh release upload android pax-historia.apk --clobber
