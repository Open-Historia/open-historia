name: Build Android APK

# Builds the Android app and attaches the APK to the rolling "android" release,
# so players just download and install — no Android SDK needed on anyone's
# machine. Run it from the Actions tab (workflow_dispatch) after changing mobile/
# or the client, or push an android-v* tag.
#
# The app is the web bundle built with `--mode android`, with the world map
# INSIDE the APK: the library lives on the phone, the three pmtiles archives and
# the regions GeoJSON ride under www/assets, and nothing is streamed from the
# network any more. The community hub and the player's own AI provider are
# the only network use. It used to be the website's bundle verbatim, and before
# that a thin WebView pointed at a server the player ran themselves.
#
# This is the STABLE app, built from `main`. The beta app, "Open Historia Beta",
# is built from `beta` by android-apk-beta.yml: a second app with its own id,
# saves, icon, release (`android-beta`) and update feed, installed beside this
# one. A dispatch from any other branch is refused below — that is how beta
# code once reached the stable release (build 14, 2026-09-25).

on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # A dispatch run picks its own branch from a dropdown, and `beta` is in that
      # dropdown too — a run from there would publish the beta's code as the stable
      # app. A tag run is exempt: its ref is the tag, and the tag pattern says which
      # line it came from.
      - name: Refuse to dispatch this from anything but main
        if: github.event_name == 'workflow_dispatch' && github.repository == 'Open-Historia/open-historia' && github.ref_name != 'main'
        run: |
          echo "::error::The stable Android app is built from main. For the beta app run Build Android APK (Beta) from beta."
          exit 1

      - uses: actions/checkout@v5

      # latest.json is the feed every app installed under the earlier id reads,
      # forever: its update banner installs whatever APK it names. It used to
      # name open-historia.apk, which is now the app under its new id, a different
      # app: offered as an update it would install beside the old one, without
      # the player's games. So until a handover build has been published (and
      # latest.json names it), a run without the handover variables stops here.
      - name: Keep the earlier id's feed off the new app
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_APP_ID: ${{ vars.ANDROID_LEGACY_APP_ID }}
        run: |
          if [ -n "$LEGACY_APP_ID" ]; then exit 0; fi
          if gh release download android --repo "${{ github.repository }}" -p latest.json -O feed-now.json 2>/dev/null \
            && grep -q '/open-historia.apk"' feed-now.json; then
            echo "::error::android/latest.json still offers open-historia.apk to the apps installed under the earlier id. Set the repository variables ANDROID_LEGACY_APP_ID and ANDROID_LEGACY_HOST (docs/mobile.md) so this run publishes the handover build."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          # Node 24 is the Active LTS; Node 20 went end-of-life in March 2026 and
          # GitHub removes the Node 20 action runtime on 23 Sep 2026.
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # VITE_APP_BUILD is what makes the in-app update banner take its APK path:
      # it compares this number against the one in the release manifest and offers
      # the new APK. The web router answers /api/app-update for it from the
      # latest.json this workflow publishes below.
      - name: Build the Android bundle
        env:
          VITE_APP_BUILD: ${{ github.run_number }}
          VITE_APP_TRACK: stable
        run: |
          npm ci
          npm run build:android

      # The six map files are pinned by sha256 in scripts/map-assets.web.json, the list the website's build reads too;
      # a cache hit skips ~70 MB of downloads and the verify still runs.
      - name: Restore the map data
        uses: actions/cache@v4
        with:
          path: map-cache
          key: android-map-data-${{ hashFiles('scripts/map-assets.web.json') }}

      - name: Build the APK
        env:
          # versionCode/versionName come from the run number, so every build is
          # an upgrade over the last one (Android refuses a lower versionCode).
          # The handover build gets the same number: it is higher than any build
          # this workflow made under the earlier id, so it installs over them.
          OH_ANDROID_BUILD: ${{ github.run_number }}
          # One keystore across builds, or an APK cannot install over its
          # predecessor (each fresh debug keystore is a different certificate).
          # Without the secrets the build falls back to debug signing.
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # The handover build (docs/mobile.md, "Moving to the new app id"): the
          # same code under the application id and WebView address the app had
          # until November 2026, for the phones that still have it installed.
          # Both come from repository variables, so neither is in the repository;
          # with both set, this run builds it after the app.
          LEGACY_APP_ID: ${{ vars.ANDROID_LEGACY_APP_ID }}
          LEGACY_HOST: ${{ vars.ANDROID_LEGACY_HOST }}
        run: |
          if [ -n "$LEGACY_APP_ID$LEGACY_HOST" ] && { [ -z "$LEGACY_APP_ID" ] || [ -z "$LEGACY_HOST" ]; }; then
            echo "::error::The repository variables ANDROID_LEGACY_APP_ID and ANDROID_LEGACY_HOST go together: set both or neither."
            exit 1
          fi
          cd mobile
          npm ci
          npm run map
          npm run www
          npx cap sync android
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > app/release.keystore
            export OH_ANDROID_KEYSTORE="$PWD/app/release.keystore"
            TASK=assembleRelease
            BUILT=app/build/outputs/apk/release/app-release.apk
          else
            echo "No ANDROID_KEYSTORE_B64 secret: debug-signed build (cannot upgrade in place over a build signed with another key)."
            TASK=assembleDebug
            BUILT=app/build/outputs/apk/debug/app-debug.apk
          fi
          ./gradlew "$TASK" --no-daemon
          cp "$BUILT" ../../open-historia.apk
          if [ -n "$LEGACY_APP_ID" ]; then
            # The same web bundle; the earlier id, and the earlier address the
            # page opens at (that is where the WebView keeps its saves).
            OH_ANDROID_LEGACY_APP_ID="$LEGACY_APP_ID" OH_ANDROID_LEGACY_HOST="$LEGACY_HOST" node ../scripts/legacy-config.mjs
            OH_ANDROID_LEGACY_APP_ID="$LEGACY_APP_ID" ./gradlew "$TASK" --no-daemon
            cp "$BUILT" ../../open-historia-handover.apk
            node ../scripts/legacy-config.mjs
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: open-historia.apk
          path: |
            open-historia.apk
            open-historia-handover.apk
          if-no-files-found: ignore

      # update.json is what the app's update banner reads (src/runtime/web/router.js
      # answers /api/app-update from it). latest.json is the earlier id's feed,
      # written only with the handover build. The asset name open-historia.apk is
      # contractual: the site and the banner both link to it by name.
      - name: Publish to the rolling "android" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > update.json <<EOF
          {
            "build": ${{ github.run_number }},
            "apk": "https://github.com/${{ github.repository }}/releases/download/android/open-historia.apk",
            "notes": "Build ${{ github.run_number }}: the whole game on your phone — saves, scenarios, the workshop and the world map — with the community hub and your AI provider as the only network use."
          }
          EOF
          ASSETS="open-historia.apk update.json"
          if [ -f open-historia-handover.apk ]; then
            cat > latest.json <<EOF
          {
            "build": ${{ github.run_number }},
            "apk": "https://github.com/${{ github.repository }}/releases/download/android/open-historia-handover.apk",
            "notes": "One last update: it installs the new Open Historia app beside this one and moves your games to it."
          }
          EOF
            ASSETS="$ASSETS open-historia-handover.apk latest.json"
          fi
          NOTES="Open Historia for Android. Download open-historia.apk below and open it to install (allow installs from your browser when Android asks). Everything is on the device: your saves and scenarios, the scenario workshop, and the world map — it plays in airplane mode from the first launch. The community hub and your own AI provider are the only things that use the network. It updates itself when a newer build is published here.

          Already had Open Historia on your phone? The app has a new Android id, so this one installs beside it instead of over it. The one you had updates itself one last time and then shows you the way across: tap Install the new app, then Move my games. Your games and settings come with you, and nothing in the old app is deleted; once you have checked your games in the new app, you can uninstall the old one. (open-historia-handover.apk and latest.json are that last update; the old app downloads them itself.)

          Build: ${{ github.run_number }}"
          gh release create android --title "Android app" --notes "$NOTES" 2>/dev/null \
            || gh release edit android --notes "$NOTES"
          gh release upload android $ASSETS --clobber
