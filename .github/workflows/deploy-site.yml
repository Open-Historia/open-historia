name: Deploy website

# Builds openhistoria.com and publishes it on every push to main, so the site is
# never behind the code. Also runnable on demand from the Actions tab.
#
# Why an Action rather than connecting Pages to the repo: the Pages project is a
# direct-upload one, and Cloudflare cannot convert those to Git-connected. Doing
# it that way would mean a NEW project and moving openhistoria.com onto it, i.e.
# downtime on the live domain to gain what this file already gives.
#
# The map is part of the site: `build:site` fetches the six files pinned in
# scripts/map-assets.web.json from the map-data Release, verifies each against
# its sha256 and lays them under /play/assets/ (scripts/stage-map-assets.mjs),
# every one under Pages' 25 MiB a file. The build fails if one cannot be had,
# so a site without its map is never deployed. A runner has no other map files
# to sweep in by accident: the desktop's are gitignored and never on it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Docs and the mobile app can't change what the site serves; skip the build
    # rather than spend minutes rebuilding an identical bundle.
    paths-ignore:
      - "**.md"
      - "mobile/**"
      - ".github/**"

permissions:
  contents: read
  deployments: write

concurrency:
  # A push while a deploy is running should supersede it, not race it onto the
  # live domain in whatever order the two happen to finish.
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 24 (Active LTS). Node 20 is end-of-life, and wrangler 4 — what
          # wrangler-action@v4 installs by default — needs Node 22 or newer.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ~69 MB that changes only when the list does; without this every deploy
      # downloads it again.
      - name: Restore the map data
        uses: actions/cache@v4
        with:
          path: map-cache
          key: web-map-data-${{ hashFiles('scripts/map-assets.web.json') }}

      - name: Build the site
        # Landing page at /, game at /play/, the map under /play/assets/.
        # seed-web-defaults.mjs reads the default scenario out of server/seed,
        # which IS committed; the map files come from the map-data Release.
        run: npm run build:site

      - name: Refuse to deploy an oversized bundle
        # Cloudflare Pages rejects any file over 25 MiB, and it rejects it AFTER
        # reporting a successful build — so without this the failure looks like a
        # green deploy that silently kept serving the old site.
        run: |
          big=$(find dist-site -type f -size +24M)
          if [ -n "$big" ]; then
            echo "::error::Files over Pages' 25 MiB limit:"; echo "$big"
            exit 1
          fi
          echo "No oversized files. dist-site is $(du -sh dist-site | cut -f1)."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch main is what marks this the PRODUCTION deployment. Without
          # it Pages treats the upload as a preview and openhistoria.com keeps
          # serving the previous build while the deploy still reports success.
          command: pages deploy dist-site --project-name=open-historia --branch=main
