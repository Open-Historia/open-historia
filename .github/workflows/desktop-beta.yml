# Builds the desktop installers from the `beta` integration branch for Windows,
# macOS and Linux and publishes them to the `desktop-beta` pre-release.
#
# It is the same pipeline as desktop-installer.yml with two additions — the channel
# stamp and a different electron-builder config — and together those are what make
# the beta a separate application: it installs BESIDE the official Open Historia
# rather than over it, keeps its own saves, and updates itself from its own release
# instead of being walked onto the stable build. Nothing here touches the stable
# release or its `desktop-stable` tag.
#
# Two ways to start it, the same two the stable workflow offers:
#
#   * Actions → Desktop beta installers → Run workflow → `beta`. GitHub only
#     lists a workflow_dispatch entry if the file is on the DEFAULT branch, so a
#     copy of this file is kept on `main` purely to make the entry appear — the
#     copy on the branch you select is the one that actually runs. Same
#     arrangement as android-apk-beta.yml.
#     Clearing the tag field builds the installers without publishing them.
#   * push a tag matching `desktop-beta-v*` at a commit on `beta`. A tag push
#     runs the workflow file from the tagged tree, so this works whatever is on
#     `main`.
#
# The tag pattern deliberately does not match the stable `desktop-v*` trigger in
# desktop-installer.yml: a tag that matched both would publish a beta build to the
# `desktop-stable` release. `desktop-beta` — the release tag itself — matches
# neither, so creating it below cannot start another run.
name: Desktop beta installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the beta installers to
        required: false
        default: desktop-beta
      publish:
        description: Publish to that release (clear to build the installers only)
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "desktop-beta-v*"

# The release is created and its assets uploaded from here.
permissions:
  contents: write
  # SignPath fetches the Windows build's artifacts through this run's token
  # (docs/code-signing.md). Read-only, and unused while signing is not set up.
  actions: read

jobs:
  # The suite runs once, on Linux, before any installer is built: run in each of
  # the three builds it cost Windows five and a half minutes a run (a process for
  # each of some 900 test files, on a runner whose virus scanner reads every file
  # opened), to tell what Linux had already told. A red suite still stops all
  # three, as `build` needs this job. Stamped as the builds stamp their tree.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse to dispatch this from anything but beta
        if: github.event_name == 'workflow_dispatch' && github.repository == 'Open-Historia/open-historia' && github.ref_name != 'beta'
        shell: bash
        run: |
          echo "::error::Run this with 'Use workflow from: beta'."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp the build id
        shell: bash
        run: echo "{\"build\":\"${{ github.run_id }}\"}" > electron/build-id.json

      - name: Stamp the release channel
        run: node scripts/stamp-channel.mjs beta

      - name: Stamp the app version and package name
        shell: bash
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='0.0.${{ github.run_number }}';p.name='open-historia-beta';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"

      # server/betaPackaging.test.js is in here, and it is the only thing that
      # catches the beta's two update feeds drifting onto different tags, or
      # latest.json below naming a file electron-builder does not produce. Both
      # fail silently at runtime, so they have to fail loudly here.
      - name: Run the tests
        run: npm test

  build:
    needs: test
    # Windows code signing through SignPath Foundation (docs/code-signing.md). It
    # runs only on the Windows job, and only once the owner has set the secret and
    # the three variables; without them every step it adds is skipped and the
    # build is exactly the unsigned one it always was. Secrets cannot be read in
    # a step's `if:`, hence this flag.
    env:
      SIGNPATH_ENABLED: ${{ matrix.os == 'windows-latest' && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
    strategy:
      fail-fast: false # one platform failing must not throw away the other two
      matrix:
        include:
          # Each installer must be built on its own OS: electron-builder shells out
          # to platform tooling (NSIS on Windows, hdiutil for the .dmg), and a macOS
          # build simply cannot be produced anywhere but macOS.
          - os: windows-latest
            args: --win
            # The product name "Open Historia", so SignPath Foundation can sign it;
            # its program, folder, shortcuts and saves stay the beta's own.
            config: electron-builder.beta-win.yml
          - os: macos-latest
            args: --mac
            config: electron-builder.beta.yml
          - os: ubuntu-latest
            args: --linux
            config: electron-builder.beta.yml
    runs-on: ${{ matrix.os }}
    # A build takes 3 to 15 minutes; a hang stops here instead of at six hours.
    # A signed Windows build waits on two manual SignPath approvals as well.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && vars.SIGNPATH_PROJECT_SLUG != '' && 150 || 45 }}
    steps:
      # A dispatch run picks its own branch from a dropdown, and `main` is in that
      # dropdown too — a run from there would package the released code, call it the
      # beta and publish it. A tag run is exempt: its ref is the tag, not a branch,
      # and the tag pattern is what says which line it came from.
      - name: Refuse to dispatch this from anything but beta
        if: github.event_name == 'workflow_dispatch' && github.repository == 'Open-Historia/open-historia' && github.ref_name != 'beta'
        shell: bash
        run: |
          echo "::error::Run this with 'Use workflow from: beta'."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Building a .dmg mounts a volume and then detaches it, and Spotlight starts
      # indexing that volume the moment it appears — `hdiutil detach` then fails
      # with exit 16 and takes the whole macOS build with it. (Same reason as the
      # stable workflow.)
      - name: Stop Spotlight indexing the build volume
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Install dependencies
        run: npm ci

      # The map archives are NOT packaged — they are ~170MB and the app downloads
      # them on first launch — so nothing here fetches them.
      - name: Stamp the build id
        shell: bash
        run: |
          echo "{\"build\":\"${{ github.run_id }}\"}" > electron/build-id.json
          cat electron/build-id.json

      # What makes the packaged app behave as the beta at RUNTIME: its own Chromium
      # profile, its own save library, its own update feed, its window title. The
      # installer config below only decides how it is installed and what it is
      # called. Both are needed — neither implies the other.
      - name: Stamp the release channel
        run: node scripts/stamp-channel.mjs beta

      # package.json ships 0.0.0, and electron-updater compares semver: a build whose
      # version never changes is one it will never offer as an update, and one Windows
      # will not cleanly install over. run_number is shared by all three jobs in a
      # run, so one run is one version on every platform, and it only ever goes up.
      #
      # `name` is stamped too. electron-builder derives two things from it that
      # nothing else renames: the folder electron-updater downloads into
      # (<name>-updater under %LOCALAPPDATA%) and the .deb package name. Left as
      # the stable app's, the two apps shared one pending-update folder — each
      # cleans out the other's downloaded installer — and the beta .deb replaced
      # the official install on Linux instead of sitting beside it. productName,
      # appId and the userData rename in main.cjs do not reach either.
      - name: Stamp the app version and package name
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='0.0.${{ github.run_number }}';p.name='open-historia-beta';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          node -p "require('./package.json').name+' '+require('./package.json').version"
          # The product version every signed file must carry
          # (.signpath/artifact-configuration.xml).
          echo "APP_VERSION=0.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      # (The tests ran in the `test` job above, on this same commit.)

      # The map editor's Generate drawer runs the game's own copy of Azgaar's
      # Fantasy Map Generator, and the installer packs it (build.files:
      # fmg/dist/**). --required: a run that cannot fetch it stops here, rather
      # than attach an installer whose editor has no Generate drawer.
      - name: Vendor the map generator
        run: node scripts/fetch-fmg.mjs --required

      # The program the Advisor microphone hears the player through with the
      # system's own speech recognition (electron/speechSystem.cjs): C# with
      # Windows' own compiler, Swift with Xcode's; nothing on Linux, which has
      # none. --required: a Windows or macOS installer without it would quietly
      # use Whisper for everyone.
      - name: Build the system speech program
        run: node scripts/build-speech-helpers.mjs ${{ matrix.args }} --required

      - name: Build the client
        run: npm run build

      # --config is what separates this from the stable workflow: its own appId,
      # productName, icon, artifact names and update feed. It REPLACES package.json's
      # `build` block rather than extending it.
      - name: Build the installer
        run: node scripts/package-desktop.mjs ${{ matrix.args }} --config ${{ matrix.config }} --publish never
        env:
          # electron-builder itself never signs: Windows is signed by SignPath in
          # the steps below, macOS has no certificate. Without this it tries to
          # discover one and fails the build rather than skipping signing.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Windows code signing, when it is set up (env.SIGNPATH_ENABLED above). The
      # same steps as desktop-installer.yml, with the beta's config and names: the
      # app's own programs are signed first, the installer is rebuilt around them
      # and signed in turn, latest.yml is rewritten for the signed installer, and
      # the update chunks below are cut from the signed app.
      # electron-builder's resource editor writes the program's product version
      # as four numbers (0.0.N.0); every signed file must say the build's own 0.0.N.
      - name: Write the program's product version as the build's
        if: env.SIGNPATH_ENABLED == 'true'
        shell: bash
        run: node scripts/set-product-version.mjs --version "$APP_VERSION" "release/win-unpacked/Open Historia Beta.exe"

      # SignPath enforces this too; checking first fails in seconds instead of
      # after an approval.
      - name: Check the programs' product name and version
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: ./scripts/check-signing-metadata.ps1 -Version $env:APP_VERSION -Path release/win-unpacked -Include '*.exe' -Unpacked

      - name: Collect the app's programs for signing
        id: unsigned-app
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: signpath-app-unsigned
          path: |
            release/win-unpacked/*.exe
            release/win-unpacked/resources/app.asar.unpacked/**/*.exe
            release/win-unpacked/resources/app.asar.unpacked/**/*.node
          if-no-files-found: error
          retention-days: 1
          # A re-run of the job uploads again under the same name.
          overwrite: true

      - name: Sign the app's programs
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          # The artifact configuration's ${version}: every signed file must say it.
          parameters: |
            version: "${{ env.APP_VERSION }}"
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app

      - name: Put the signed programs back in the app
        if: env.SIGNPATH_ENABLED == 'true'
        shell: bash
        run: cp -Rv signed-app/. release/win-unpacked/

      # --prepackaged packs the folder as it is (see desktop-installer.yml).
      - name: Rebuild the installer around the signed app
        if: env.SIGNPATH_ENABLED == 'true'
        run: node scripts/package-desktop.mjs --win --prepackaged release/win-unpacked --config electron-builder.beta-win.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Check the installer's product name and version
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: ./scripts/check-signing-metadata.ps1 -Version $env:APP_VERSION -Path release -Include 'Open-Historia-Beta-Setup.exe'

      - name: Collect the installer for signing
        id: unsigned-installer
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: signpath-installer-unsigned
          path: release/Open-Historia-Beta-Setup.exe
          if-no-files-found: error
          retention-days: 1
          # A re-run of the job uploads again under the same name.
          overwrite: true

      - name: Sign the installer
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          # The artifact configuration's ${version}: every signed file must say it.
          parameters: |
            version: "${{ env.APP_VERSION }}"
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Put the signed installer in place and rewrite the update feed for it
        if: env.SIGNPATH_ENABLED == 'true'
        shell: bash
        run: |
          cp -v signed-installer/Open-Historia-Beta-Setup.exe release/Open-Historia-Beta-Setup.exe
          node scripts/refresh-update-feed.mjs --feed release/latest.yml --file release/Open-Historia-Beta-Setup.exe
          cat release/latest.yml

      # Fails the build rather than publish anything unsigned as signed.
      - name: Check the Windows signatures
        id: signed
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release/win-unpacked/*.exe) + @(Get-Item release/Open-Historia-Beta-Setup.exe)
          if (Test-Path release/win-unpacked/resources/app.asar.unpacked) {
            $files += @(Get-ChildItem release/win-unpacked/resources/app.asar.unpacked -Recurse -Include *.exe,*.node)
          }
          $bad = 0
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($signature.Status)  $($signature.SignerCertificate.Subject)  $($file.FullName)"
            if ($signature.Status -ne 'Valid') { $bad += 1 }
          }
          if ($bad -gt 0) { Write-Error "$bad file(s) are not validly signed"; exit 1 }
          "signed=true" >> $env:GITHUB_OUTPUT

      # The same files a second time, cut into chunks: an installed app updates by
      # fetching the chunks that changed instead of the installer again
      # (scripts/build-update-chunks.mjs, electron/payloadUpdate.cjs). They go to a
      # release of their own, named after the installers' with "-chunks" on the
      # end, and they go up before the installers below, so an app the banner
      # tells of this build already finds its chunks. A problem here never costs
      # the release its installers: an app that finds no chunks takes the
      # installer, as every app did before.
      - name: Cut the app's files into update chunks
        continue-on-error: true
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest) app="release/win-unpacked/resources/app.asar"; platform=win ;;
            macos-latest) app="$(ls -d release/mac*/*.app | head -1)/Contents/Resources/app.asar"; platform=mac ;;
            *) app="release/linux-unpacked/resources/app.asar"; platform=linux ;;
          esac
          node scripts/build-update-chunks.mjs --app "$app" --out update-chunks --platform "$platform" --channel beta

      - name: Publish the update chunks
        continue-on-error: true
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'desktop-beta' }}
        shell: bash
        run: node scripts/publish-update-chunks.mjs --dir update-chunks --tag "${TAG}-chunks" --repo "${{ github.repository }}"

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v6
        with:
          name: open-historia-beta-${{ matrix.os }}
          # Only the finished installers; release/ also holds the unpacked app tree.
          path: |
            release/*.exe
            release/*-mac-*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

      # Unticking `publish` builds the installers and stops. They are still uploaded
      # as run artifacts above, so this is how you get a build to try without
      # offering it to anyone.
      #
      # A separate boolean rather than the stable workflow's `inputs.tag != ''`,
      # which does not work: an omitted or empty value falls back to the input's
      # DEFAULT, so inputs.tag is never empty and that condition is always true.
      # Measured, not assumed - run 33929212744 was dispatched with `-f tag=` and
      # published anyway, with TAG=desktop-beta in its log.
      - name: Attach to the beta release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          # A FIXED tag, never the branch and never the tag that was pushed — and
          # this is the ONE place this workflow deliberately does not do what the
          # stable one does. desktop-installer.yml publishes a tag push to the tag
          # that was pushed; here that would leave the build at `desktop-beta-v5`,
          # which neither of the beta's two update feeds reads: both hardcode
          # `desktop-beta` (BETA_UPDATE_MANIFEST in electron/main.cjs and `publish`
          # in electron-builder.beta.yml), so testers would simply never be offered
          # it. The input exists only for one-off builds that deliberately go
          # somewhere private, and it deliberately does not reach either of those.
          TAG: ${{ inputs.tag || 'desktop-beta' }}
        shell: bash
        run: |
          # --prerelease so GitHub labels it, and never marks it "Latest" over the
          # stable release in the same repo. Three jobs race here, so creating it
          # tolerates "already exists"; --clobber lets a re-run replace assets.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            printf '%s\n' \
              '**Beta build of Open Historia.** Not the official release — that is the one marked `Latest` on this page.' \
              '' \
              'It installs **alongside** the official app as *Open Historia Beta*, with its own Start Menu entry and a BETA-badged icon. Both can stay installed; uninstalling one leaves the other.' \
              '' \
              '**Your official games are not touched.** The beta keeps its own saves, scenarios and settings, so nothing you play here can reach a campaign in the official app — and nothing you have played there shows up here. That is on purpose: this branch is far enough ahead that a save the beta writes would come back from the official app with the new systems stripped out of it.' \
              '' \
              'It does share one thing: the downloaded world map, so there is no second 170MB download if you already have the official app installed.' \
              '' \
              '- Windows: `Open-Historia-Beta-Setup.exe`' \
              '- macOS: `Open-Historia-Beta-mac-arm64.zip` (Apple Silicon) or `-x64` (Intel) — unsigned, so the first time macOS closes it: choose Done, then System Settings → Privacy & Security → Open Anyway (macOS 14 and earlier: right-click → Open).' \
              '- Linux: `Open-Historia-Beta-x86_64.AppImage`, or `Open-Historia-Beta-amd64.deb`' \
              '' \
              'It updates itself from this page, never onto the official build.' \
              '' \
              '**Do not run both at once** if you can help it — they are separate apps with separate saves, but they will both want the same map files.' \
              '' \
              'Feedback: [open an issue](https://github.com/Open-Historia/open-historia/issues).' \
              > notes.md
            # --target pins the tag to the commit this run built. Without it the tag
            # would be created on the repository's DEFAULT branch — main — which is
            # the one place a beta release must never point.
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Open Historia Beta" \
              --notes-file notes.md || true
          fi
          shopt -s nullglob
          # latest*.yml is what electron-updater actually reads (the `publish` block
          # in electron-builder.beta.yml points it at this tag). Omit them and the
          # beta ships with a feed URL that resolves to nothing: the banner still
          # appears — that comes from latest.json below — but pressing update fails
          # and falls back to a manual download, with no failing build to notice.
          files=(release/*.exe release/*-mac-*.zip release/*.AppImage release/*.deb)
          feeds=(release/latest*.yml)
          # Only the Windows job writes latest.json, so three racing jobs cannot each
          # publish a different view of the same release. The filenames here must
          # match the artifactNames in electron-builder.beta.yml exactly — a mismatch
          # breaks the update banner silently, which is what
          # server/betaPackaging.test.js exists to catch.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            B="https://github.com/${{ github.repository }}/releases/download/$TAG"
            printf '{\n  "build": "%s",\n  "notes": "%s",\n  "windows": "%s/Open-Historia-Beta-Setup.exe",\n  "mac": "%s/Open-Historia-Beta-mac-arm64.zip",\n  "linux": "%s/Open-Historia-Beta-x86_64.AppImage"\n}\n' \
              "${{ github.run_id }}" "A newer Open Historia beta build is available." "$B" "$B" "$B" > latest.json
            cat latest.json
            feeds+=(latest.json)
          fi
          # Installers first, feeds last, as two uploads. gh sends the files of one
          # upload concurrently and --clobber deletes each old asset before its
          # replacement lands, so a single upload has a window — as long as the
          # 140 MB installer takes — in which latest.json already announces the
          # new build while the installer it points at is a 404. A tester pressing
          # Update in that window saw "0%" and then the manual download.
          # Announcing only once the installers are in place closes it.
          gh release upload "$TAG" "${files[@]}" --clobber
          gh release upload "$TAG" "${feeds[@]}" --clobber

      # Only when this run's Windows build was signed (steps.signed): the release
      # page then says so, with the attribution and the policy link SignPath
      # Foundation asks every download page for. Once per release.
      - name: Say on the release that the Windows build is signed
        if: steps.signed.outputs.signed == 'true' && (github.event_name == 'push' || inputs.publish)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'desktop-beta' }}
        shell: bash
        run: |
          body="$(gh release view "$TAG" --json body --jq .body)"
          case "$body" in *"Code signing policy"*) exit 0 ;; esac
          {
            printf '%s\n\n' "$body"
            printf '%s\n' '**Windows:** the installer and the app are code-signed. Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org). [Code signing policy](https://github.com/Open-Historia/open-historia#code-signing-policy)'
          } > signing-notes.md
          gh release edit "$TAG" --notes-file signing-notes.md

  # Once every system's build of this release is up, the chunks no build names
  # any more come off the chunk release, which holds 1,000 files at most
  # (scripts/publish-update-chunks.mjs --prune-only). It is the last job, on its
  # own, so it never runs beside a publish of the same release, and it never
  # removes what a head still leads to or anything uploaded in the last six
  # hours. A system whose build failed keeps its old head, and so its chunks.
  prune-chunks:
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Remove the update chunks no build names any more
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'desktop-beta' }}
        run: node scripts/publish-update-chunks.mjs --prune-only --tag "${TAG}-chunks" --repo "${{ github.repository }}"
