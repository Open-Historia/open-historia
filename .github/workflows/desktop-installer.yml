# Builds the desktop app for Windows, macOS and Linux and attaches the installers
# to a release. The player-facing point of this file is that NOTHING is built on
# the player's machine any more: the client is compiled here, packaged with the
# server into an Electron app, and shipped as one download per platform.
name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the installers to
        required: false
        default: desktop-stable
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write
  # SignPath fetches the Windows build's artifacts through this run's token
  # (docs/code-signing.md). Read-only, and unused while signing is not set up.
  actions: read

jobs:
  build:
    # Windows code signing through SignPath Foundation (docs/code-signing.md). It
    # runs only on the Windows job, and only once the owner has set the secret and
    # the three variables; without them every step it adds is skipped and the
    # build is exactly the unsigned one it always was. Secrets cannot be read in
    # a step's `if:`, hence this flag.
    env:
      SIGNPATH_ENABLED: ${{ matrix.os == 'windows-latest' && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
    strategy:
      fail-fast: false # one platform failing must not throw away the other two
      matrix:
        include:
          # Each installer must be built on its own OS: electron-builder shells out
          # to platform tooling (NSIS on Windows, hdiutil for the .dmg), and a macOS
          # build simply cannot be produced anywhere but macOS.
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    # A build takes 3 to 15 minutes; a hang stops here instead of at six hours.
    # A signed Windows build waits on two manual SignPath approvals as well.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && vars.SIGNPATH_PROJECT_SLUG != '' && 150 || 45 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Building a .dmg mounts a volume and then detaches it. On the macOS runners
      # Spotlight starts indexing that volume the moment it appears and still holds
      # it when dmg-builder tries to unmount, so `hdiutil detach` fails with exit 16
      # (resource busy) and takes the whole build with it. Nothing here needs an
      # index.
      - name: Stop Spotlight indexing the build volume
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Install dependencies
        run: npm ci

      # The map archives are NOT packaged - they are ~200MB and the app downloads
      # them on first launch - so nothing here fetches them.
      # One id for all three platforms in this run, baked into the app and written
      # into latest.json below. The app compares the two to know an update exists.
      - name: Stamp the build id
        shell: bash
        run: |
          echo "{\"build\":\"${{ github.run_id }}\"}" > electron/build-id.json
          cat electron/build-id.json

      # package.json ships 0.0.0 and electron-updater decides whether an update
      # exists by comparing SEMVER — so without a real, increasing version here
      # every build would look identical to the one already installed and the app
      # would never update itself. run_number increments per run and is shared by
      # all three jobs in it, so one release is one version on every platform.
      # APP_VERSION: the product version every signed file must carry
      # (.signpath/artifact-configuration.xml); the speech program is built with it
      # (scripts/build-speech-helpers.mjs).
      - name: Stamp the app version
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='0.0.${{ github.run_number }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          node -p "'version: '+require('./package.json').version"
          echo "APP_VERSION=0.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      # The map editor's Generate drawer runs the game's own copy of Azgaar's
      # Fantasy Map Generator, and the installer packs it (build.files:
      # fmg/dist/**). --required: a run that cannot fetch it stops here, rather
      # than attach an installer whose editor has no Generate drawer.
      - name: Vendor the map generator
        run: node scripts/fetch-fmg.mjs --required

      # The program the Advisor microphone hears the player through with the
      # system's own speech recognition (electron/speechSystem.cjs): C# with
      # Windows' own compiler, Swift with Xcode's; nothing on Linux, which has
      # none. --required: a Windows or macOS installer without it would quietly
      # use Whisper for everyone.
      - name: Build the system speech program
        run: node scripts/build-speech-helpers.mjs ${{ matrix.args }} --required

      - name: Build the client
        run: npm run build

      # --publish never still WRITES the latest*.yml feed files (the publish block
      # in package.json is what produces them); it only declines to upload them,
      # which the release step below does itself.
      - name: Build the installer
        run: node scripts/package-desktop.mjs ${{ matrix.args }} --publish never
        env:
          # electron-builder itself never signs: Windows is signed by SignPath in
          # the steps below, macOS has no certificate. Without this it tries to
          # discover one and fails the build rather than skipping signing.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Windows code signing, when it is set up (env.SIGNPATH_ENABLED above). It
      # all happens before anything is hashed: the app's own programs are signed
      # first, the installer is rebuilt around them and signed in turn, and
      # latest.yml is rewritten for the signed installer. The update chunks below
      # are then cut from the signed app. SignPath signs GitHub artifacts, so
      # each round is an upload, a signing request that waits for the owner's
      # approval, and the signed files put back. .signpath/artifact-configuration.xml
      # says what is signed in each.
      # electron-builder's resource editor writes the program's product version
      # as four numbers (0.0.N.0); every signed file must say the build's own
      # 0.0.N, as the installer and the speech program do.
      - name: Write the program's product version as the build's
        if: env.SIGNPATH_ENABLED == 'true'
        shell: bash
        run: node scripts/set-product-version.mjs --version "$APP_VERSION" "release/win-unpacked/Open Historia.exe"

      # SignPath enforces this too; checking first fails in seconds instead of
      # after an approval.
      - name: Check the programs' product name and version
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: ./scripts/check-signing-metadata.ps1 -Version $env:APP_VERSION -Path release/win-unpacked -Include '*.exe' -Unpacked

      - name: Collect the app's programs for signing
        id: unsigned-app
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: signpath-app-unsigned
          path: |
            release/win-unpacked/*.exe
            release/win-unpacked/resources/app.asar.unpacked/**/*.exe
            release/win-unpacked/resources/app.asar.unpacked/**/*.node
          if-no-files-found: error
          retention-days: 1
          # A re-run of the job uploads again under the same name.
          overwrite: true

      - name: Sign the app's programs
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          # The artifact configuration's ${version}: every signed file must say it.
          parameters: |
            version: "${{ env.APP_VERSION }}"
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app

      # The signed zip holds the same paths as the upload, relative to win-unpacked.
      - name: Put the signed programs back in the app
        if: env.SIGNPATH_ENABLED == 'true'
        shell: bash
        run: cp -Rv signed-app/. release/win-unpacked/

      # --prepackaged packs the folder as it is: no second pack, so nothing
      # rewrites the signed programs, and app-update.yml from the build above is
      # kept. It writes the installer and latest.yml again.
      - name: Rebuild the installer around the signed app
        if: env.SIGNPATH_ENABLED == 'true'
        run: node scripts/package-desktop.mjs --win --prepackaged release/win-unpacked --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Check the installer's product name and version
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: ./scripts/check-signing-metadata.ps1 -Version $env:APP_VERSION -Path release -Include 'Open-Historia-Setup.exe'

      - name: Collect the installer for signing
        id: unsigned-installer
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: signpath-installer-unsigned
          path: release/Open-Historia-Setup.exe
          if-no-files-found: error
          retention-days: 1
          # A re-run of the job uploads again under the same name.
          overwrite: true

      - name: Sign the installer
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          # The artifact configuration's ${version}: every signed file must say it.
          parameters: |
            version: "${{ env.APP_VERSION }}"
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      # electron-updater checks a download against latest.yml's sha512 and size,
      # which were written for the installer before it was signed.
      - name: Put the signed installer in place and rewrite the update feed for it
        if: env.SIGNPATH_ENABLED == 'true'
        shell: bash
        run: |
          cp -v signed-installer/Open-Historia-Setup.exe release/Open-Historia-Setup.exe
          node scripts/refresh-update-feed.mjs --feed release/latest.yml --file release/Open-Historia-Setup.exe
          cat release/latest.yml

      # Fails the build rather than publish anything unsigned as signed.
      - name: Check the Windows signatures
        id: signed
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release/win-unpacked/*.exe) + @(Get-Item release/Open-Historia-Setup.exe)
          if (Test-Path release/win-unpacked/resources/app.asar.unpacked) {
            $files += @(Get-ChildItem release/win-unpacked/resources/app.asar.unpacked -Recurse -Include *.exe,*.node)
          }
          $bad = 0
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($signature.Status)  $($signature.SignerCertificate.Subject)  $($file.FullName)"
            if ($signature.Status -ne 'Valid') { $bad += 1 }
          }
          if ($bad -gt 0) { Write-Error "$bad file(s) are not validly signed"; exit 1 }
          "signed=true" >> $env:GITHUB_OUTPUT

      # The same files a second time, cut into chunks: an installed app updates by
      # fetching the chunks that changed instead of the installer again
      # (scripts/build-update-chunks.mjs, electron/payloadUpdate.cjs). They go to a
      # release of their own, named after the installers' with "-chunks" on the
      # end, and they go up before the installers below, so an app the banner
      # tells of this build already finds its chunks. A problem here never costs
      # the release its installers: an app that finds no chunks takes the
      # installer, as every app did before.
      - name: Cut the app's files into update chunks
        continue-on-error: true
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest) app="release/win-unpacked/resources/app.asar"; platform=win ;;
            macos-latest) app="$(ls -d release/mac*/*.app | head -1)/Contents/Resources/app.asar"; platform=mac ;;
            *) app="release/linux-unpacked/resources/app.asar"; platform=linux ;;
          esac
          node scripts/build-update-chunks.mjs --app "$app" --out update-chunks --platform "$platform" --channel stable

      - name: Publish the update chunks
        continue-on-error: true
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: node scripts/publish-update-chunks.mjs --dir update-chunks --tag "${TAG}-chunks" --repo "${{ github.repository }}"

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v6
        with:
          name: open-historia-${{ matrix.os }}
          # Only the finished installers; release/ also holds the unpacked app tree.
          path: |
            release/*.exe
            release/*-mac-*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          # --clobber so re-running replaces the asset instead of erroring, and the
          # release is created on first use rather than having to exist already.
          # Three jobs race here, so creating it tolerates "already exists".
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Open Historia for Desktop" \
              --notes "Windows, macOS and Linux downloads. The world map downloads on first launch." \
            || true
          shopt -s nullglob
          # The latest*.yml files ARE the update feed: electron-updater fetches
          # latest.yml (win) / latest-mac.yml / latest-linux.yml from this release
          # and compares the version in it against the running app. One per
          # platform, so the three jobs cannot overwrite each other's.
          files=(release/*.exe release/*-mac-*.zip release/*.AppImage release/*.deb release/latest*.yml)
          # Only the Windows job writes latest.json, so three racing jobs cannot
          # each publish a different view of the same release.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            B="https://github.com/${{ github.repository }}/releases/download/$TAG"
            cat > latest.json <<JSON
          {
            "build": "${{ github.run_id }}",
            "windows": "$B/Open-Historia-Setup.exe",
            "mac": "$B/Open-Historia-mac-arm64.zip",
            "linux": "$B/Open-Historia-x86_64.AppImage",
            "linuxDeb": "$B/Open-Historia-amd64.deb"
          }
          JSON
            files+=(latest.json)
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

      # Only when this run's Windows build was signed (steps.signed): the release
      # page then says so, with the attribution and the policy link SignPath
      # Foundation asks every download page for. Once per release.
      - name: Say on the release that the Windows build is signed
        if: steps.signed.outputs.signed == 'true' && (github.event_name == 'push' || inputs.tag != '')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          body="$(gh release view "$TAG" --json body --jq .body)"
          case "$body" in *"Code signing policy"*) exit 0 ;; esac
          {
            printf '%s\n\n' "$body"
            printf '%s\n' '**Windows:** the installer and the app are code-signed. Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org). [Code signing policy](https://github.com/Open-Historia/open-historia#code-signing-policy)'
          } > signing-notes.md
          gh release edit "$TAG" --notes-file signing-notes.md

  # Once every system's build of this release is up, the chunks no build names
  # any more come off the chunk release, which holds 1,000 files at most
  # (scripts/publish-update-chunks.mjs --prune-only). It is the last job, on its
  # own, so it never runs beside a publish of the same release, and it never
  # removes what a head still leads to or anything uploaded in the last six
  # hours. A system whose build failed keeps its old head, and so its chunks.
  prune-chunks:
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Remove the update chunks no build names any more
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: node scripts/publish-update-chunks.mjs --prune-only --tag "${TAG}-chunks" --repo "${{ github.repository }}"
