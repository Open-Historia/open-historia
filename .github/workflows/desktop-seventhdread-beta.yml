# Builds the UNOFFICIAL SeventhDread beta from the Seventh-Dread-Beta branch for
# Windows, macOS and Linux and publishes it to a pre-release.
#
# It is the same pipeline as desktop-installer.yml with one substitution — the
# electron-builder config — and that config is what makes the beta a separate
# application: it installs alongside the official Open Historia rather than over
# it, while electron/main.cjs points both builds at the SAME save library, so a
# tester can move between the two mid-campaign. Nothing here touches the stable
# release or its `desktop-stable` tag.
#
# Run it from the Actions tab (Run workflow), choosing `Seventh-Dread-Beta` under
# "Use workflow from". A copy of this file has to sit on the default branch for
# GitHub to list it at all, but the copy on the branch you select is the one that
# actually runs — same arrangement as android-apk-beta.yml.
name: Desktop beta (SeventhDread)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the beta installers to
        required: false
        default: desktop-seventhdread-beta

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false # one platform failing must not throw away the other two
      matrix:
        include:
          # Each installer must be built on its own OS: electron-builder shells out
          # to platform tooling (NSIS on Windows, hdiutil for the .dmg), and a macOS
          # build simply cannot be produced anywhere but macOS.
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      # Listing this workflow requires a copy on the default branch, so the branch
      # dropdown also offers `main` — and a run from there would package official
      # code as the beta. Fail before checkout rather than publish that. Scoped to
      # the upstream repo: in the fork the default branch IS the beta work, so the
      # branch name means nothing there and the rehearsal run must be allowed.
      - name: Refuse to build anything but the beta branch
        if: github.repository == 'Open-Historia/open-historia' && github.ref_name != 'Seventh-Dread-Beta'
        shell: bash
        run: |
          echo "::error::Run this with 'Use workflow from: Seventh-Dread-Beta'."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Spotlight holds the mounted build volume and makes `hdiutil detach` fail
      # with exit 16, which takes the whole macOS build with it. Nothing here
      # needs an index. (Same reason as the stable workflow.)
      - name: Stop Spotlight indexing the build volume
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Install dependencies
        run: npm ci

      # One id for all three platforms in this run, baked into the app and written
      # into latest.json below. The beta app compares the two — against ITS OWN
      # release, not the stable one — to know a newer build exists.
      - name: Stamp the build id
        shell: bash
        run: |
          echo "{\"build\":\"${{ github.run_id }}\"}" > electron/build-id.json
          cat electron/build-id.json

      # What makes the packaged app behave as the beta at RUNTIME: its own Chromium
      # profile, its update manifest, the in-app badge. The installer config
      # below only decides how it is installed and what it is called.
      - name: Stamp the release channel
        run: node scripts/stamp-channel.mjs beta

      # The build id above is what the BANNER compares; this is what the UPDATER
      # compares, and they are not interchangeable. electron-updater decides an
      # update exists by SEMVER, and package.json ships 0.0.0 on every branch — so
      # without a real, increasing version here every beta would look identical to
      # the one already installed and nothing would ever self-install, however many
      # builds were published.
      #
      # run_number, not run_id: it increments by one per run of THIS workflow and
      # is shared by all three jobs in a run, so one beta release is one version on
      # every platform. run_id is unique but not ordered, and semver needs order.
      # This counter is the beta workflow's own — that it is unrelated to the
      # stable app's version is fine, and in fact the point: separate apps,
      # separate feeds, no comparison between them is ever made.
      - name: Stamp the app version
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='0.0.${{ github.run_number }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          node -p "'version: '+require('./package.json').version"

      - name: Build the client
        run: npm run build

      # --config is the only difference from the stable workflow: separate appId,
      # productName, artifact names, and ohChannel=beta baked into the packaged
      # package.json.
      #
      # --publish never still WRITES the latest*.yml feed files — the `publish`
      # block in electron-builder.beta.yml is what produces them, not this flag. It
      # only declines to UPLOAD them, which the release step below does itself with
      # the same gh call it already used for the installers.
      - name: Build the installer
        run: npx electron-builder ${{ matrix.args }} --config electron-builder.beta.yml --publish never
        env:
          # No code-signing certificate. Without this electron-builder tries to
          # discover one and fails the build rather than skipping signing.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v6
        with:
          name: open-historia-seventhdread-beta-${{ matrix.os }}
          # Only the finished installers; release/ also holds the unpacked app tree.
          path: |
            release/*.exe
            release/*-mac-*.zip
            release/*.AppImage
          if-no-files-found: error

      - name: Attach to the beta release
        env:
          GH_TOKEN: ${{ github.token }}
          # A FIXED tag, never the branch or a per-build tag: this exact URL is
          # baked into every shipped build as BETA_UPDATE_MANIFEST, so publishing
          # anywhere else silently stops testers being offered updates. The input
          # exists only for one-off builds that deliberately go somewhere private.
          TAG: ${{ inputs.tag || 'desktop-seventhdread-beta' }}
        shell: bash
        run: |
          # --prerelease so GitHub labels it, and never marks it "Latest" over the
          # stable release in the same repo. Three jobs race here, so creating it
          # tolerates "already exists"; --clobber lets a re-run replace assets.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # A heredoc rather than a per-line printf chain: these notes are markdown full
            # of backticks, quotes and blockquotes, and re-quoting all of that for the
            # shell is how the macOS instructions here came to be wrong for two releases.
            # <<'MD' is unexpanded, so nothing below is touched by bash. The body sits at
            # column 0 of this run block (heredocs take no indentation) and so does the MD.
            cat > notes.md <<'MD'
          # Open Historia — SeventhDread Beta

          An unofficial beta build. It installs **alongside** the official app and **shares your saves** with it, so you can swap between them mid-campaign.

          This is a beta, it may break your save games, make sure to back them up regularly.

          > Run only one at a time — both write the same saves. 
          > Upgrading from the older "Open Historia Beta" from my fork? Uninstall that first; it's a separate app. Your saves are safe.

          - Windows: `Open-Historia-SeventhDread-Beta-Setup.exe`
          - macOS: `Open-Historia-SeventhDread-Beta-mac-arm64.zip` (Apple Silicon) or `-x64` (Intel)
          - Linux: `Open-Historia-SeventhDread-Beta-x86_64.AppImage`

          **macOS, first launch.** The build carries no Apple developer signature, so macOS stops it once. Control-click the app and choose **Open**; on macOS 15 and later, try to open it, then click **Open Anyway** under System Settings → Privacy & Security. If macOS instead calls the app *damaged* and offers you neither, it is the same missing signature — clear the download flag in Terminal, then open it again:

          ```
          xattr -dr com.apple.quarantine "/Applications/Open Historia SeventhDread Beta.app"
          ```

          ---

          ## ⚠️ The new unit system is a separate toggle — WIP

          **Settings → Experimental → "Beta unit system"** — **off** unless you turn it on.

          It is **WIP**. Don't enable it on a campaign you care about. Everything else in this release is unaffected by that switch.

          If you try it: it's stored per save, needs a reload to take effect (there's a button), and switching it back off loses nothing.

          The new unit system is meant to push other countries to place more units, gives you the ability to give each unit an order, the AI is more likely to move your units etc based on your current events.

          Other countries may start placing enemy units at your border as a sign of aggression.

          A lot of this experimental unit system is currently broken and is in active development.

          ## 📋 Turn on detailed logging before reporting a bug

          **Settings → Diagnostics** → turn on **Detailed logging** → hit **Clear** → reproduce the bug → **📋 Copy log** and attach it to your issue. It's the most useful thing you can send us, and the only thing that survives a crash.

          Feel free to leave Detailed logging on, it is capped at 1MB of data and will automatically delete the oldest data. 
          By leaving it on, if you encounter a bug, you will already have detailed logs captured.

          Your API keys are never in the log. Country names, your orders and — with detailed logging on — your conversations are, so give it a glance before posting it publicly.

          ---

          ## What's in my beta

          **Advisor** 
          One-click **"Send message to X"** for letters it drafts, no copy-pasting. 
          It can create, edit and remove queued actions directly in chat. 
          Proper markdown tables, and a retry button when a provider fails.
          Advisor now sees the whole map, not just your territory

          **Chat** 
          Sorted by last activity, message timestamps, retry on failed messages, and fixes
          for unread counts and stale threads.

          **🎯 Projects & Operations** 
          A new panel for efforts spanning multiple rounds: research, construction, military and covert operations. Progress bars, milestones, overdue and slipped-milestone warnings, tags and filters, "Ask advisor" and "Show on map". The AI keeps it updated; you set priority.

          **Timeline** 
          A **↩ Rollback turn** button, and the event camera no longer flies to the wrong country.

          **Map** 
          Unit flag icons, fixed layer ordering, regions stay clickable when zoomed in, and disputed territory renders and clears properly.
          Fixed any issues in regions not transferring when taken over

          **AI reliability**
          Malformed model replies are repaired instead of throwing the turn away, odd tool-call formats are handled, and several cases where the game quietly ignored what the AI said are fixed.

          **Network** 
          **Settings → Network → "Let other devices connect"** for playing from your phone, which shows you the exact address to type in. Off by default for security reasons as it is not password protected.

          **The build**
          Its own installer, icon and window title, a lock so two copies can't corrupt a save. Feel free to have both this Beta and the stable build installed at the same time. 
          While you can share save games, it's not recommended going from Beta to stable as this can have unknown issues. 

          ---

          Bugs and feedback → [Issues](https://github.com/Open-Historia/open-historia/issues)
          Make sure to label your issue as part of my SeventhDread's beta, and include any debugging messages from fallbacks, or advisor chats as well as the logging file from settings.
          MD
            # --target pins the tag to the commit this run built. Without it the tag
            # would be created on the repository's DEFAULT branch — main — which is
            # the one place a beta release must never point.
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Open Historia (SeventhDread Beta)" \
              --notes-file notes.md || true
          fi
          shopt -s nullglob
          # The latest*.yml files ARE the update feed: electron-updater fetches
          # latest.yml (Windows) / latest-linux.yml from the beta tag and compares
          # the version in it against the running app. One per platform, so the
          # three racing jobs cannot overwrite each other's. latest-mac.yml is
          # uploaded too and simply never read — mac cannot self-update unsigned,
          # so nothing there asks for it.
          files=(release/*.exe release/*-mac-*.zip release/*.AppImage release/latest*.yml)
          # Only the Windows job writes latest.json, so three racing jobs cannot
          # each publish a different view of the same release. The filenames here
          # must match the artifactNames in electron-builder.beta.yml exactly — a
          # mismatch breaks self-update silently, with no failing build to notice.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            B="https://github.com/${{ github.repository }}/releases/download/$TAG"
            printf '{\n  "build": "%s",\n  "notes": "%s",\n  "windows": "%s/Open-Historia-SeventhDread-Beta-Setup.exe",\n  "mac": "%s/Open-Historia-SeventhDread-Beta-mac-arm64.zip",\n  "linux": "%s/Open-Historia-SeventhDread-Beta-x86_64.AppImage"\n}\n' \
              "${{ github.run_id }}" "A newer SeventhDread beta build is available." "$B" "$B" "$B" > latest.json
            cat latest.json
            files+=(latest.json)
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
