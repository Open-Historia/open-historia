name: Native app (macOS)

on:
  push:
    branches: [native-macos]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_BASE: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
  NODE_VERSION: 24.18.0
  RUST_TOOLCHAIN: 1.99.1
  AVIF_SAMPLES: https://raw.githubusercontent.com/AOMediaCodec/av1-avif/bf4c18d1f3971069b75e87d6ee469790589f4f09/testFiles

jobs:
  build:
    name: Build, sign and smoke-test the macOS app
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the Rust targets
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/engine -> target
          key: macos-universal
          cache-on-failure: true

      - name: Build the engine library for both Macs and join them
        working-directory: native/engine
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build -p oh_gdext --release --target aarch64-apple-darwin
          cargo build -p oh_gdext --release --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create target/aarch64-apple-darwin/release/liboh_gdext.dylib target/x86_64-apple-darwin/release/liboh_gdext.dylib -output target/universal-apple-darwin/release/liboh_gdext.dylib
          lipo -info target/universal-apple-darwin/release/liboh_gdext.dylib
          ls -la target/aarch64-apple-darwin/release/liboh_gdext.dylib target/x86_64-apple-darwin/release/liboh_gdext.dylib target/universal-apple-darwin/release/liboh_gdext.dylib
          otool -L target/universal-apple-darwin/release/liboh_gdext.dylib | grep -E "WebKit|AppKit"

      - name: Build the front engine for both Macs and join them
        working-directory: native/engine
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build -p ohfronts --bin ohfronts-host --release --target aarch64-apple-darwin
          cargo build -p ohfronts --bin ohfronts-host --release --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create target/aarch64-apple-darwin/release/ohfronts-host target/x86_64-apple-darwin/release/ohfronts-host -output target/universal-apple-darwin/release/ohfronts-host
          lipo -info target/universal-apple-darwin/release/ohfronts-host
          echo '{"t":"ping","id":1}' | arch -arm64 target/universal-apple-darwin/release/ohfronts-host | grep -q '"t":"pong"'
          echo '{"t":"ping","id":1}' | arch -x86_64 target/universal-apple-darwin/release/ohfronts-host | grep -q '"t":"pong"' || echo "::warning::the x86_64 slice of the front engine could not be run here"

      - name: Read the Godot checksums
        id: godot
        run: |
          curl -fsSL "$GODOT_BASE/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot-sums.txt"
          editor=$(awk '$2 == "Godot_v4.7.2-stable_macos.universal.zip" {print $1}' "$RUNNER_TEMP/godot-sums.txt")
          templates=$(awk '$2 == "Godot_v4.7.2-stable_export_templates.tpz" {print $1}' "$RUNNER_TEMP/godot-sums.txt")
          test ${#editor} -eq 128 && test ${#templates} -eq 128
          echo "editor=$editor" >> "$GITHUB_OUTPUT"
          echo "templates=$templates" >> "$GITHUB_OUTPUT"
          echo "key=godot-4.7.2-${editor:0:16}-${templates:0:16}" >> "$GITHUB_OUTPUT"

      - name: Restore Godot from the cache
        id: godot-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/godot-cache
          key: ${{ steps.godot.outputs.key }}

      - name: Download Godot and its macOS template (sha512 checked)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          EDITOR_SHA: ${{ steps.godot.outputs.editor }}
          TEMPLATES_SHA: ${{ steps.godot.outputs.templates }}
        run: |
          mkdir -p ~/godot-cache "$RUNNER_TEMP/godot-dl"
          cd "$RUNNER_TEMP/godot-dl"
          curl -fsSL --retry 3 "$GODOT_BASE/Godot_v4.7.2-stable_macos.universal.zip" -o editor.zip
          echo "$EDITOR_SHA  editor.zip" | shasum -a 512 -c -
          curl -fsSL --retry 3 "$GODOT_BASE/Godot_v4.7.2-stable_export_templates.tpz" -o templates.tpz
          echo "$TEMPLATES_SHA  templates.tpz" | shasum -a 512 -c -
          ditto -x -k editor.zip ~/godot-cache
          unzip -q -j templates.tpz templates/macos.zip templates/version.txt -d ~/godot-cache
          cat ~/godot-cache/version.txt
          rm -rf "$RUNNER_TEMP/godot-dl"

      - name: Save Godot to the cache
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/godot-cache
          key: ${{ steps.godot.outputs.key }}

      - name: Check the Godot tools
        run: |
          ls ~/godot-cache
          echo "OH_GODOT_EDITOR=$HOME/godot-cache/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          echo "OH_GODOT_TEMPLATE=$HOME/godot-cache/macos.zip" >> "$GITHUB_ENV"
          "$HOME/godot-cache/Godot.app/Contents/MacOS/Godot" --version

      - name: Download node for both Macs (sha256 checked) and join them
        run: |
          mkdir -p "$RUNNER_TEMP/node" && cd "$RUNNER_TEMP/node"
          curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/SHASUMS256.txt" -o SHASUMS256.txt
          for arch in arm64 x64; do
            name="node-v$NODE_VERSION-darwin-$arch.tar.gz"
            curl -fsSL --retry 3 "https://nodejs.org/dist/v$NODE_VERSION/$name" -o "$name"
            grep "  $name\$" SHASUMS256.txt | shasum -a 256 -c -
            tar -xzf "$name"
          done
          lipo -create "node-v$NODE_VERSION-darwin-arm64/bin/node" "node-v$NODE_VERSION-darwin-x64/bin/node" -output node-universal
          lipo -info node-universal
          codesign --verify --verbose=2 node-universal
          ./node-universal --version
          echo "OH_NODE_BIN=$RUNNER_TEMP/node/node-universal" >> "$GITHUB_ENV"

      - name: Install the server packages
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fetch the Fantasy Map Generator (the pinned, prepared copy the desktop installers ship)
        run: node scripts/fetch-fmg.mjs --required

      - name: Install the sidecar packages with both darwin node-datachannel builds
        working-directory: native/sidecar
        run: |
          npm ci --no-audit --no-fund
          version=$(node -p 'require("./package-lock.json").packages["node_modules/@node-datachannel/darwin-x64"].version')
          integrity=$(node -p 'require("./package-lock.json").packages["node_modules/@node-datachannel/darwin-x64"].integrity')
          for arch in arm64 x64; do
            target="node_modules/@node-datachannel/darwin-$arch"
            if [ ! -f "$target/node_datachannel.node" ]; then
              tarball=$(npm pack "@node-datachannel/darwin-$arch@$version" --pack-destination "$RUNNER_TEMP" --silent)
              want=$(node -p "require('./package-lock.json').packages['node_modules/@node-datachannel/darwin-$arch'].integrity")
              got="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/$tarball" | base64)"
              test "$got" = "$want" || { echo "integrity mismatch for darwin-$arch"; exit 1; }
              mkdir -p "$target"
              tar -xzf "$RUNNER_TEMP/$tarball" -C "$target" --strip-components=1
            fi
            file "$target/node_datachannel.node"
          done
          echo "lockfile darwin-x64 $version $integrity"

      - name: Run the sidecar tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for test in native/sidecar/test/*.test.mjs; do
            echo "::group::$test"
            node --test --test-reporter=spec "$test" 2>&1 | tee -a "$RUNNER_TEMP/sidecar-tests.log"
            echo "::endgroup::"
          done
          grep -E "^ℹ (tests|pass|fail|skipped)|^✔|^✖|﹣" "$RUNNER_TEMP/sidecar-tests.log" | tail -60 || true

      - name: Build, sign and package the app
        env:
          OH_NATIVE_NOTES: A macOS build of Open Historia Native from the native-macos branch.
        run: node native/package-mac.mjs "$RUNNER_TEMP/out" --probe 2>&1 | tee "$RUNNER_TEMP/package.log"

      - name: Inspect the bundle
        run: |
          app="$RUNNER_TEMP/out/Open Historia Native.app"
          plutil -p "$app/Contents/Info.plist"
          ls -la "$app/Contents/MacOS" "$app/Contents/Frameworks" "$app/Contents/Resources"
          for bin in "$app/Contents/MacOS/Open Historia" "$app/Contents/Resources/app/runtime/node" "$app/Contents/Resources/app/runtime/liboh_gdext.dylib" "$app/Contents/Resources/app/native/sidecar/imagecodec/oh-imagecodec" "$app/Contents/Resources/app/native/sidecar/ohfronts/ohfronts-host" "$app/Contents/Helpers/Open Historia Notifier.app/Contents/MacOS/Open Historia Notifier"; do lipo -info "$bin"; done
          fmg="$app/Contents/Resources/app/fmg/dist"
          grep -q "open-historia: prepared copy" "$fmg/index.html"
          test -f "$fmg/oh-native-bridge.html"
          echo "map generator: $(find "$fmg" -type f | wc -l | tr -d ' ') files, $(du -sh "$fmg" | cut -f1), $(cat "$app/Contents/Resources/app/fmg/.version")"
          codesign --display --verbose=2 "$app" 2>&1
          codesign --verify --deep --strict --verbose=2 "$app"
          du -sh "$app" "$RUNNER_TEMP/out/chunks" "$RUNNER_TEMP"/out/*.zip "$RUNNER_TEMP"/out/*.dmg

      - name: Post a notification with the bundled notifier
        run: |
          app="$RUNNER_TEMP/out/Open Historia Native.app"
          node native/macos/notifier-smoke.mjs "$app" "$RUNNER_TEMP/out/notifier-smoke.log"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Read the AVIF samples with the shipped helper
        run: |
          mkdir -p "$RUNNER_TEMP/avif" && cd "$RUNNER_TEMP/avif"
          curl -fsSL "$AVIF_SAMPLES/Link-U/kimono.avif" -o kimono.avif
          curl -fsSL "$AVIF_SAMPLES/Link-U/kimono.rotate90.avif" -o kimono.rotate90.avif
          curl -fsSL "$AVIF_SAMPLES/Microsoft/bbb_alpha_inverted.avif" -o bbb_alpha_inverted.avif
          curl -fsSL "$AVIF_SAMPLES/Netflix/avis/alpha_video.avif" -o alpha_video.avif
          shasum -a 256 -c - <<'SUMS'
          c2da5892f6a72b509c702b1e42d89946708f1cbc60d9bd392edfebfb58612e9f  kimono.avif
          e609c14b5915c0bcfd8f041e2bc6e5df755c8a83c9ad2f95ca0b576625d730e9  kimono.rotate90.avif
          83d68084a93f043a89d10373f0ca26dafc988eec811b8076cabb2ff1580c1817  bbb_alpha_inverted.avif
          493d6325d1981f7c98074266f91c5119599271396f6e9a0670c16904ead9113d  alpha_video.avif
          SUMS
          stage="$RUNNER_TEMP/out/Open Historia Native.app/Contents/Resources/app"
          "$stage/runtime/node" "$GITHUB_WORKSPACE/native/macos/avif-smoke.mjs" "$stage" "$RUNNER_TEMP/avif" | tee "$RUNNER_TEMP/out/avif-smoke.log"

      - name: Smoke-test the app headless (Apple Silicon)
        run: |
          node native/macos/smoke-mac.mjs "$RUNNER_TEMP/out/Open Historia Native.app" "$RUNNER_TEMP/out/probe/Open Historia.pck" "$RUNNER_TEMP/out/smoke-arm64-headless.log"

      - name: Smoke-test the app headless (Intel slice under Rosetta)
        continue-on-error: true
        run: |
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
          node native/macos/smoke-mac.mjs "$RUNNER_TEMP/out/Open Historia Native.app" "$RUNNER_TEMP/out/probe/Open Historia.pck" "$RUNNER_TEMP/out/smoke-x86_64-rosetta.log" --arch x86_64

      - name: Smoke-test the app in a window
        continue-on-error: true
        run: |
          node native/macos/smoke-mac.mjs "$RUNNER_TEMP/out/Open Historia Native.app" "$RUNNER_TEMP/out/probe/Open Historia.pck" "$RUNNER_TEMP/out/smoke-arm64-windowed.log" --windowed

      - name: Give the runner's screen room for a 1440x900 window
        id: screen
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/tour"
          brew install displayplacer >/dev/null 2>&1 || brew install jakehilborn/jakehilborn/displayplacer >/dev/null 2>&1 || true
          displayplacer list | tee "$RUNNER_TEMP/tour/displayplacer-runner.txt"
          node native/macos/display-setup.mjs physical 1920x1080 | tee "$RUNNER_TEMP/tour/display-setup-1x.txt"; test "${PIPESTATUS[0]}" = 0
          system_profiler SPDisplaysDataType | tee "$RUNNER_TEMP/tour/displays-1x.txt"

      - name: Tour the windowed app with real input (1440x900)
        id: tour
        continue-on-error: true
        run: node native/macos/tour.mjs "$RUNNER_TEMP/out/Open Historia Native.app" "$RUNNER_TEMP/out/tour/Open Historia.pck" "$RUNNER_TEMP/tour/1x"

      - name: Add a virtual Retina display (1600x1000 points at 2x) and make it the main one
        id: retina
        continue-on-error: true
        run: |
          clang -fobjc-arc -O2 -framework Foundation -framework CoreGraphics native/macos/hidpi-display.m -o "$RUNNER_TEMP/hidpi-display"
          nohup "$RUNNER_TEMP/hidpi-display" 1600 1000 > "$RUNNER_TEMP/tour/hidpi-display.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/hidpi-display.pid"
          sleep 5
          cat "$RUNNER_TEMP/tour/hidpi-display.log"
          displayplacer list | tee "$RUNNER_TEMP/tour/displayplacer-retina.txt"
          node native/macos/display-setup.mjs retina 1600x1000 | tee "$RUNNER_TEMP/tour/display-setup-2x.txt"; test "${PIPESTATUS[0]}" = 0
          system_profiler SPDisplaysDataType | tee "$RUNNER_TEMP/tour/displays-2x.txt"

      - name: Tour again on the Retina display (or at an emulated 2x if no Retina display could be made)
        id: tour2x
        continue-on-error: true
        run: |
          if [ "${{ steps.retina.outcome }}" = success ]; then
            node native/macos/tour.mjs "$RUNNER_TEMP/out/Open Historia Native.app" "$RUNNER_TEMP/out/tour/Open Historia.pck" "$RUNNER_TEMP/tour/2x" --tag x2- --only menu,settings,history,game,gestures --skip notify,war --screens c-menu-games,c-hud,c-settings-general,c-ai-setup,g-2-shift-tilt
          else
            node native/macos/tour.mjs "$RUNNER_TEMP/out/Open Historia Native.app" "$RUNNER_TEMP/out/tour/Open Historia.pck" "$RUNNER_TEMP/tour/2x" --tag x2- --scale 2 --size 960x500 --only menu,settings,history,game --skip notify,war --screens c-menu-games,c-hud,c-settings-general
          fi

      - name: Remove the virtual display
        if: always()
        continue-on-error: true
        run: |
          if [ -f "$RUNNER_TEMP/hidpi-display.pid" ]; then kill "$(cat "$RUNNER_TEMP/hidpi-display.pid")" 2>/dev/null || true; fi
          sleep 2
          displayplacer list 2>/dev/null | grep -E "^(Persistent screen id|Type|Resolution|Scaling):" || true

      - name: Read the notifications usernoted delivered
        if: always()
        continue-on-error: true
        run: |
          log show --last 90m --style compact --predicate 'subsystem == "com.apple.UserNotifications" OR process == "usernoted"' 2>/dev/null | grep -i "openhistoria" | grep -iE "Adding|Added|Delivering|Presenting|scheduled|Authorization|Requested" | tail -60 | tee "$RUNNER_TEMP/tour/usernotifications.txt"
          grep -h "usernoted\|notifier smoke" "$RUNNER_TEMP/out/notifier-smoke.log" | tail -30 | tee "$RUNNER_TEMP/tour/notifier-smoke-usernoted.txt" || true

      - name: First open of the published zip (quarantine, Gatekeeper, the documented step)
        id: firstopen
        continue-on-error: true
        timeout-minutes: 15
        run: bash native/macos/first-open.sh "$RUNNER_TEMP/tour/first-open"

      - name: The self-updater leaves no quarantine behind (the updater tests on a real .app)
        id: updaterquarantine
        continue-on-error: true
        run: |
          node --test --test-reporter=spec --test-name-pattern "tools build|unquarantined" native/sidecar/test/update-mac.test.mjs 2>&1 | tee "$RUNNER_TEMP/tour/first-open/updater-quarantine.txt"; test "${PIPESTATUS[0]}" = 0
          grep -E "^ℹ (tests|pass|fail|skipped)" "$RUNNER_TEMP/tour/first-open/updater-quarantine.txt"
          ! grep -qE "^ℹ (pass 0|fail [1-9])" "$RUNNER_TEMP/tour/first-open/updater-quarantine.txt"

      - name: Compose the contact sheets
        if: always()
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          for pass in 1x 2x; do
            if [ -d "$RUNNER_TEMP/tour/$pass/shots" ]; then "$RUNNER_TEMP/venv/bin/python" native/macos/contact-sheet.py "$RUNNER_TEMP/tour/$pass/shots" "$RUNNER_TEMP/tour/contact-sheet-$pass.png" "macOS $(sw_vers -productVersion) $(uname -m) tour $pass"; fi
          done
          cat "$RUNNER_TEMP"/tour/*/tour-*summary.json 2>/dev/null || true

      - name: Upload the tour
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-macOS-tour
          path: ${{ runner.temp }}/tour
          if-no-files-found: warn

      - name: Gather the smoke logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP"/out/*.log "$RUNNER_TEMP"/out/sidecar-smoke.json "$RUNNER_TEMP"/out/shell.txt "$RUNNER_TEMP/package.log" "$RUNNER_TEMP/sidecar-tests.log" "$RUNNER_TEMP/logs/" 2>/dev/null || true
          grep -h "smoke summary\|avif smoke\|notifier smoke" "$RUNNER_TEMP"/logs/*.log 2>/dev/null | tee "$RUNNER_TEMP/logs/summary.txt" || true
          ls -la "$RUNNER_TEMP"/out || true

      - name: Stop here if the sidecar tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::the sidecar tests failed; see sidecar-tests.log in the smoke logs"
          exit 1

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-macOS
          path: |
            ${{ runner.temp }}/out/Open-Historia-Native-macOS.zip
            ${{ runner.temp }}/out/Open-Historia-Native-macOS.dmg
            ${{ runner.temp }}/out/native-latest-mac.json
          compression-level: 0
          if-no-files-found: error

      - name: Upload the update chunks
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-macOS-chunks
          path: ${{ runner.temp }}/out/chunks
          compression-level: 0
          if-no-files-found: error

      - name: Upload the probe pack
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-macOS-probe
          path: ${{ runner.temp }}/out/probe
          if-no-files-found: error

      - name: Upload the smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-macOS-smoke-logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: warn

      - name: Stop here if a desktop check failed
        if: always()
        run: |
          echo "tour 1x: ${{ steps.tour.outcome }}"
          echo "tour 2x: ${{ steps.tour2x.outcome }}"
          echo "first open: ${{ steps.firstopen.outcome }}"
          echo "updater quarantine: ${{ steps.updaterquarantine.outcome }}"
          test "${{ steps.tour.outcome }}" = success && test "${{ steps.tour2x.outcome }}" = success && test "${{ steps.firstopen.outcome }}" = success && test "${{ steps.updaterquarantine.outcome }}" = success

  intel:
    name: Smoke-test on an Intel Mac
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: native/macos

      - uses: actions/download-artifact@v4
        with:
          name: Open-Historia-Native-macOS
          path: ${{ runner.temp }}/app

      - uses: actions/download-artifact@v4
        with:
          name: Open-Historia-Native-macOS-probe
          path: ${{ runner.temp }}/probe

      - name: Unpack the app
        run: |
          ditto -x -k "$RUNNER_TEMP/app/Open-Historia-Native-macOS.zip" "$RUNNER_TEMP/unpacked"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/unpacked/Open Historia Native.app"

      - name: Smoke-test the app headless (Intel)
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          "$RUNNER_TEMP/unpacked/Open Historia Native.app/Contents/Resources/app/runtime/node" native/macos/smoke-mac.mjs "$RUNNER_TEMP/unpacked/Open Historia Native.app" "$RUNNER_TEMP/probe/Open Historia.pck" "$RUNNER_TEMP/logs/smoke-intel-headless.log"

      - name: Upload the smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-macOS-smoke-intel
          path: ${{ runner.temp }}/logs
          if-no-files-found: warn
