name: Native app

on:
  push:
    branches: [native]
    # A push that touches only what the native app is not made from (the docs,
    # the website, the phone app, the hub templates, the other workflows) builds
    # nothing: every run here spends macOS minutes, which count 10x.
    paths:
      - "**"
      - "!*.md"
      - "!docs/**"
      - "!wiki/**"
      - "!site/**"
      - "!mobile/**"
      - "!hub-templates/**"
      - "!.github/**"
      - ".github/workflows/native-release.yml"
  workflow_dispatch:
    inputs:
      tours:
        description: Run the windowed tours, the first-open check and the Intel Mac smoke test (slow; macOS minutes count 10x)
        required: false
        type: boolean
        default: false
      publish:
        description: Publish to Open-Historia/open-historia when the release token is set (clear for a dry run)
        required: false
        type: boolean
        default: true
      notes:
        description: The release note the apps show for this build
        required: false
        type: string
        default: ""
      android:
        description: Also build the Android APKs (pushes to native always do; Node for Android comes from the cache, or is built once per Node version and ABI)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A newer push cancels the builds of the one before it (each build job has its
# own group below), but never a publish that has started: a publish cut off
# halfway leaves the feeds naming pieces that are not up yet. A newer publish
# waits for it instead.

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_BASE: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
  NODE_VERSION: 24.18.0
  NODE_LINUX_SHA256: 55aa7153f9d88f28d765fcdad5ae6945b5c0f98a36881703817e4c450fa76742
  RUST_TOOLCHAIN: 1.99.1
  AVIF_SAMPLES: https://raw.githubusercontent.com/AOMediaCodec/av1-avif/bf4c18d1f3971069b75e87d6ee469790589f4f09/testFiles
  OH_NATIVE_NOTES: ${{ inputs.notes || 'A new super-experimental build of Open Historia Native.' }}

jobs:
  # When the account's artifact storage is full, every upload fails, and it
  # fails at the END of each build, after the Mac has spent its minutes (three
  # attempts of one run on 2026-11-07 did exactly that). One tiny upload first,
  # on Linux, stops the run before any build starts.
  preflight:
    name: Check there is room for this run's artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write a marker
        run: echo "$GITHUB_SHA" > "$RUNNER_TEMP/preflight.txt"

      - name: Upload it
        uses: actions/upload-artifact@v4
        with:
          name: preflight
          path: ${{ runner.temp }}/preflight.txt
          retention-days: 1
          if-no-files-found: error

  windows:
    name: Build the Windows app
    needs: preflight
    runs-on: windows-latest
    # Typically 6 to 12 minutes; a hang stops here instead of at 90 (minutes count 2x).
    timeout-minutes: 30
    concurrency:
      group: native-release-${{ github.ref }}-windows
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the Rust toolchain (GNU, with LLVM's tools)
        run: |
          rustup set default-host x86_64-pc-windows-gnu
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools
          cd native/engine
          rustup show
          rustc -vV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/engine -> target
          key: windows-gnu
          cache-on-failure: true

      - name: Read the Godot checksums
        id: godot
        run: |
          curl -fsSL "$GODOT_BASE/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot-sums.txt"
          editor=$(awk '$2 == "Godot_v4.7.2-stable_win64.exe.zip" {print $1}' "$RUNNER_TEMP/godot-sums.txt")
          templates=$(awk '$2 == "Godot_v4.7.2-stable_export_templates.tpz" {print $1}' "$RUNNER_TEMP/godot-sums.txt")
          test ${#editor} -eq 128 && test ${#templates} -eq 128
          echo "editor=$editor" >> "$GITHUB_OUTPUT"
          echo "templates=$templates" >> "$GITHUB_OUTPUT"
          echo "key=godot-windows-4.7.2-${editor:0:16}-${templates:0:16}" >> "$GITHUB_OUTPUT"

      - name: Restore Godot from the cache
        id: godot-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/godot-cache
          key: ${{ steps.godot.outputs.key }}

      - name: Download Godot and its Windows template (sha512 checked)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          EDITOR_SHA: ${{ steps.godot.outputs.editor }}
          TEMPLATES_SHA: ${{ steps.godot.outputs.templates }}
        run: |
          mkdir -p ~/godot-cache "$RUNNER_TEMP/godot-dl"
          cd "$RUNNER_TEMP/godot-dl"
          curl -fsSL --retry 3 "$GODOT_BASE/Godot_v4.7.2-stable_win64.exe.zip" -o editor.zip
          echo "$EDITOR_SHA  editor.zip" | sha512sum -c -
          curl -fsSL --retry 3 "$GODOT_BASE/Godot_v4.7.2-stable_export_templates.tpz" -o templates.tpz
          echo "$TEMPLATES_SHA  templates.tpz" | sha512sum -c -
          7z x -y -bso0 editor.zip -o"$(cygpath -w ~/godot-cache)"
          7z e -y -bso0 templates.tpz templates/windows_release_x86_64.exe templates/version.txt -o"$(cygpath -w ~/godot-cache)"
          cat ~/godot-cache/version.txt
          cd "$RUNNER_TEMP"
          rm -rf "$RUNNER_TEMP/godot-dl"

      - name: Save Godot to the cache
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/godot-cache
          key: ${{ steps.godot.outputs.key }}

      - name: Check the Godot tools
        run: |
          ls -la ~/godot-cache
          echo "OH_GODOT_EXE=$(cygpath -w ~/godot-cache/Godot_v4.7.2-stable_win64.exe)" >> "$GITHUB_ENV"
          echo "OH_GODOT_TEMPLATE=$(cygpath -w ~/godot-cache/windows_release_x86_64.exe)" >> "$GITHUB_ENV"
          ~/godot-cache/Godot_v4.7.2-stable_win64_console.exe --headless --version

      - name: Install the server packages and the map generator
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/fetch-fmg.mjs --required

      - name: Install the sidecar packages
        working-directory: native/sidecar
        run: |
          npm ci --no-audit --no-fund --onnxruntime-node-install=skip
          ls node_modules/@node-datachannel

      - name: Build the engine library and the front engine
        run: |
          node native/build.mjs --release
          ls -la native/engine/target/release/oh_gdext.dll native/engine/target/release/ohfronts-host.exe native/godot/bin
          echo '{"t":"ping","id":1}' | native/engine/target/release/ohfronts-host.exe | grep -q '"t":"pong"'

      - name: Build and package the app
        run: node native/package.mjs "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/package.log"; test "${PIPESTATUS[0]}" = 0

      - name: Inspect the package
        run: |
          out="$RUNNER_TEMP/out"
          ls -la "$out" "$out/stage/runtime" "$out/stage/native/sidecar/ohfronts"
          du -sh "$out/stage" "$out/chunks" "$out/Open-Historia-Native-Setup.exe"
          ls "$out/chunks" | wc -l
          cat "$out/native-latest.json"
          node native/check-release.mjs local "$out"

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-Windows
          path: |
            ${{ runner.temp }}/out/Open-Historia-Native-Setup.exe
            ${{ runner.temp }}/out/native-latest.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload the update chunks
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-Windows-chunks
          path: ${{ runner.temp }}/out/chunks
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload the package log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-Windows-logs
          path: ${{ runner.temp }}/package.log
          retention-days: 3
          if-no-files-found: warn

  macos:
    name: Build, sign and smoke-test the macOS app
    needs: preflight
    runs-on: macos-latest
    # Typically 5 to 12 minutes without the tours. macOS minutes count 10x, so a
    # hang has to stop well before the old 90.
    timeout-minutes: ${{ inputs.tours && 75 || 35 }}
    concurrency:
      group: native-release-${{ github.ref }}-macos
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The two Rust builds were close to five of the job's eleven minutes, and
      # most pushes do not touch native/engine. Their two universal outputs are
      # kept by the hash of everything they are built from (the toolchain is
      # pinned in rust-toolchain.toml and named in the key), so an unchanged
      # engine is the same build, restored in seconds.
      - name: Restore the engine build for this source
        id: engine
        uses: actions/cache/restore@v4
        with:
          path: |
            native/engine/target/universal-apple-darwin/release/liboh_gdext.dylib
            native/engine/target/universal-apple-darwin/release/ohfronts-host
          key: engine-macos-universal-${{ env.RUST_TOOLCHAIN }}-11.0-${{ hashFiles('native/engine/Cargo.lock', 'native/engine/Cargo.toml', 'native/engine/rust-toolchain.toml', 'native/engine/crates/**') }}

      - name: Install the Rust targets
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup show

      - uses: Swatinem/rust-cache@v2
        if: steps.engine.outputs.cache-hit != 'true'
        with:
          workspaces: native/engine -> target
          key: macos-universal
          cache-on-failure: true

      - name: Build the engine library for both Macs and join them
        if: steps.engine.outputs.cache-hit != 'true'
        working-directory: native/engine
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build -p oh_gdext --release --target aarch64-apple-darwin
          cargo build -p oh_gdext --release --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create target/aarch64-apple-darwin/release/liboh_gdext.dylib target/x86_64-apple-darwin/release/liboh_gdext.dylib -output target/universal-apple-darwin/release/liboh_gdext.dylib
          ls -la target/aarch64-apple-darwin/release/liboh_gdext.dylib target/x86_64-apple-darwin/release/liboh_gdext.dylib

      - name: Build the front engine for both Macs and join them
        if: steps.engine.outputs.cache-hit != 'true'
        working-directory: native/engine
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build -p ohfronts --bin ohfronts-host --release --target aarch64-apple-darwin
          cargo build -p ohfronts --bin ohfronts-host --release --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create target/aarch64-apple-darwin/release/ohfronts-host target/x86_64-apple-darwin/release/ohfronts-host -output target/universal-apple-darwin/release/ohfronts-host

      - name: Check the engine library and the front engine
        working-directory: native/engine
        run: |
          echo "engine build restored from the cache: ${{ steps.engine.outputs.cache-hit == 'true' }}"
          lipo -info target/universal-apple-darwin/release/liboh_gdext.dylib
          ls -la target/universal-apple-darwin/release/liboh_gdext.dylib target/universal-apple-darwin/release/ohfronts-host
          otool -L target/universal-apple-darwin/release/liboh_gdext.dylib | grep -E "WebKit|AppKit"
          lipo -info target/universal-apple-darwin/release/ohfronts-host
          echo '{"t":"ping","id":1}' | arch -arm64 target/universal-apple-darwin/release/ohfronts-host | grep -q '"t":"pong"'
          echo '{"t":"ping","id":1}' | arch -x86_64 target/universal-apple-darwin/release/ohfronts-host | grep -q '"t":"pong"' || echo "::warning::the x86_64 slice of the front engine could not be run here"

      - name: Keep the engine build for the next push
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            native/engine/target/universal-apple-darwin/release/liboh_gdext.dylib
            native/engine/target/universal-apple-darwin/release/ohfronts-host
          key: ${{ steps.engine.outputs.cache-primary-key }}

      - name: Read the Godot checksums
        id: godot
        run: |
          curl -fsSL "$GODOT_BASE/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot-sums.txt"
          editor=$(awk '$2 == "Godot_v4.7.2-stable_macos.universal.zip" {print $1}' "$RUNNER_TEMP/godot-sums.txt")
          templates=$(awk '$2 == "Godot_v4.7.2-stable_export_templates.tpz" {print $1}' "$RUNNER_TEMP/godot-sums.txt")
          test ${#editor} -eq 128 && test ${#templates} -eq 128
          echo "editor=$editor" >> "$GITHUB_OUTPUT"
          echo "templates=$templates" >> "$GITHUB_OUTPUT"
          echo "key=godot-4.7.2-${editor:0:16}-${templates:0:16}" >> "$GITHUB_OUTPUT"

      - name: Restore Godot from the cache
        id: godot-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/godot-cache
          key: ${{ steps.godot.outputs.key }}

      - name: Download Godot and its macOS template (sha512 checked)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          EDITOR_SHA: ${{ steps.godot.outputs.editor }}
          TEMPLATES_SHA: ${{ steps.godot.outputs.templates }}
        run: |
          mkdir -p ~/godot-cache "$RUNNER_TEMP/godot-dl"
          cd "$RUNNER_TEMP/godot-dl"
          curl -fsSL --retry 3 "$GODOT_BASE/Godot_v4.7.2-stable_macos.universal.zip" -o editor.zip
          echo "$EDITOR_SHA  editor.zip" | shasum -a 512 -c -
          curl -fsSL --retry 3 "$GODOT_BASE/Godot_v4.7.2-stable_export_templates.tpz" -o templates.tpz
          echo "$TEMPLATES_SHA  templates.tpz" | shasum -a 512 -c -
          ditto -x -k editor.zip ~/godot-cache
          unzip -q -j templates.tpz templates/macos.zip templates/version.txt -d ~/godot-cache
          cat ~/godot-cache/version.txt
          rm -rf "$RUNNER_TEMP/godot-dl"

      - name: Save Godot to the cache
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/godot-cache
          key: ${{ steps.godot.outputs.key }}

      - name: Check the Godot tools
        run: |
          ls ~/godot-cache
          echo "OH_GODOT_EDITOR=$HOME/godot-cache/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          echo "OH_GODOT_TEMPLATE=$HOME/godot-cache/macos.zip" >> "$GITHUB_ENV"
          "$HOME/godot-cache/Godot.app/Contents/MacOS/Godot" --version

      - name: Download node for both Macs (sha256 checked) and join them
        run: |
          mkdir -p "$RUNNER_TEMP/node" && cd "$RUNNER_TEMP/node"
          curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/SHASUMS256.txt" -o SHASUMS256.txt
          for arch in arm64 x64; do
            name="node-v$NODE_VERSION-darwin-$arch.tar.gz"
            curl -fsSL --retry 3 "https://nodejs.org/dist/v$NODE_VERSION/$name" -o "$name"
            grep "  $name\$" SHASUMS256.txt | shasum -a 256 -c -
            tar -xzf "$name"
          done
          lipo -create "node-v$NODE_VERSION-darwin-arm64/bin/node" "node-v$NODE_VERSION-darwin-x64/bin/node" -output node-universal
          lipo -info node-universal
          codesign --verify --verbose=2 node-universal
          ./node-universal --version
          echo "OH_NODE_BIN=$RUNNER_TEMP/node/node-universal" >> "$GITHUB_ENV"

      - name: Install the server packages
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fetch the Fantasy Map Generator (the pinned, prepared copy the desktop installers ship)
        run: node scripts/fetch-fmg.mjs --required

      - name: Install the sidecar packages with both darwin node-datachannel builds
        working-directory: native/sidecar
        run: |
          npm ci --no-audit --no-fund --onnxruntime-node-install=skip
          version=$(node -p 'require("./package-lock.json").packages["node_modules/@node-datachannel/darwin-x64"].version')
          integrity=$(node -p 'require("./package-lock.json").packages["node_modules/@node-datachannel/darwin-x64"].integrity')
          for arch in arm64 x64; do
            target="node_modules/@node-datachannel/darwin-$arch"
            if [ ! -f "$target/node_datachannel.node" ]; then
              tarball=$(npm pack "@node-datachannel/darwin-$arch@$version" --pack-destination "$RUNNER_TEMP" --silent)
              want=$(node -p "require('./package-lock.json').packages['node_modules/@node-datachannel/darwin-$arch'].integrity")
              got="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/$tarball" | base64)"
              test "$got" = "$want" || { echo "integrity mismatch for darwin-$arch"; exit 1; }
              mkdir -p "$target"
              tar -xzf "$RUNNER_TEMP/$tarball" -C "$target" --strip-components=1
            fi
            file "$target/node_datachannel.node"
          done
          echo "lockfile darwin-x64 $version $integrity"

      - name: Run the sidecar tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for test in native/sidecar/test/*.test.mjs; do
            echo "::group::$test"
            node --test --test-reporter=spec "$test" 2>&1 | tee -a "$RUNNER_TEMP/sidecar-tests.log"
            echo "::endgroup::"
          done
          grep -E "^ℹ (tests|pass|fail|skipped)|^✔|^✖|﹣" "$RUNNER_TEMP/sidecar-tests.log" | tail -60 || true

      - name: Build, sign and package the app
        run: node native/package-mac.mjs "$RUNNER_TEMP/out" --probe 2>&1 | tee "$RUNNER_TEMP/package.log"; test "${PIPESTATUS[0]}" = 0

      - name: Inspect the bundle
        run: |
          app="$RUNNER_TEMP/out/Open Historia Native.app"
          plutil -p "$app/Contents/Info.plist"
          ls -la "$app/Contents/MacOS" "$app/Contents/Frameworks" "$app/Contents/Resources"
          for bin in "$app/Contents/MacOS/Open Historia" "$app/Contents/Resources/app/runtime/node" "$app/Contents/Resources/app/runtime/liboh_gdext.dylib" "$app/Contents/Resources/app/native/sidecar/imagecodec/oh-imagecodec" "$app/Contents/Resources/app/native/sidecar/ohfronts/ohfronts-host" "$app/Contents/Helpers/Open Historia Notifier.app/Contents/MacOS/Open Historia Notifier"; do lipo -info "$bin"; done
          fmg="$app/Contents/Resources/app/fmg/dist"
          grep -q "open-historia: prepared copy" "$fmg/index.html"
          test -f "$fmg/oh-native-bridge.html"
          echo "map generator: $(find "$fmg" -type f | wc -l | tr -d ' ') files, $(du -sh "$fmg" | cut -f1), $(cat "$app/Contents/Resources/app/fmg/.version")"
          codesign --display --verbose=2 "$app" 2>&1
          codesign --verify --deep --strict --verbose=2 "$app"
          du -sh "$app" "$RUNNER_TEMP/out/chunks" "$RUNNER_TEMP"/out/*.zip "$RUNNER_TEMP"/out/*.dmg

      - name: Post a notification with the bundled notifier
        run: |
          app="$RUNNER_TEMP/out/Open Historia Native.app"
          node native/macos/notifier-smoke.mjs "$app" "$RUNNER_TEMP/out/notifier-smoke.log"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Read the AVIF samples with the shipped helper
        run: |
          mkdir -p "$RUNNER_TEMP/avif" && cd "$RUNNER_TEMP/avif"
          curl -fsSL "$AVIF_SAMPLES/Link-U/kimono.avif" -o kimono.avif
          curl -fsSL "$AVIF_SAMPLES/Link-U/kimono.rotate90.avif" -o kimono.rotate90.avif
          curl -fsSL "$AVIF_SAMPLES/Microsoft/bbb_alpha_inverted.avif" -o bbb_alpha_inverted.avif
          curl -fsSL "$AVIF_SAMPLES/Netflix/avis/alpha_video.avif" -o alpha_video.avif
          shasum -a 256 -c - <<'SUMS'
          c2da5892f6a72b509c702b1e42d89946708f1cbc60d9bd392edfebfb58612e9f  kimono.avif
          e609c14b5915c0bcfd8f041e2bc6e5df755c8a83c9ad2f95ca0b576625d730e9  kimono.rotate90.avif
          83d68084a93f043a89d10373f0ca26dafc988eec811b8076cabb2ff1580c1817  bbb_alpha_inverted.avif
          493d6325d1981f7c98074266f91c5119599271396f6e9a0670c16904ead9113d  alpha_video.avif
          SUMS
          stage="$RUNNER_TEMP/out/Open Historia Native.app/Contents/Resources/app"
          "$stage/runtime/node" "$GITHUB_WORKSPACE/native/macos/avif-smoke.mjs" "$stage" "$RUNNER_TEMP/avif" | tee "$RUNNER_TEMP/out/avif-smoke.log"

      - name: Smoke-test the app headless (Apple Silicon)
        run: |
          node native/macos/smoke-mac.mjs "$RUNNER_TEMP/out/Open Historia Native.app" "$RUNNER_TEMP/out/probe/Open Historia.pck" "$RUNNER_TEMP/out/smoke-arm64-headless.log"

      # The Rosetta and windowed smoke tests never fail the run (continue-on-error)
      # and cost a minute and a quarter of macOS time, 12 minutes of quota, on
      # every push; they run with the tours, beside the Intel Mac's own smoke test.
      - name: Smoke-test the app headless (Intel slice under Rosetta)
        if: inputs.tours
        continue-on-error: true
        run: |
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
          node native/macos/smoke-mac.mjs "$RUNNER_TEMP/out/Open Historia Native.app" "$RUNNER_TEMP/out/probe/Open Historia.pck" "$RUNNER_TEMP/out/smoke-x86_64-rosetta.log" --arch x86_64

      - name: Smoke-test the app in a window
        if: inputs.tours
        continue-on-error: true
        run: |
          node native/macos/smoke-mac.mjs "$RUNNER_TEMP/out/Open Historia Native.app" "$RUNNER_TEMP/out/probe/Open Historia.pck" "$RUNNER_TEMP/out/smoke-arm64-windowed.log" --windowed

      - name: Give the runner's screen room for a 1440x900 window
        id: screen
        if: inputs.tours
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/tour"
          brew install displayplacer >/dev/null 2>&1 || brew install jakehilborn/jakehilborn/displayplacer >/dev/null 2>&1 || true
          displayplacer list | tee "$RUNNER_TEMP/tour/displayplacer-runner.txt"
          node native/macos/display-setup.mjs physical 1920x1080 | tee "$RUNNER_TEMP/tour/display-setup-1x.txt"; test "${PIPESTATUS[0]}" = 0
          system_profiler SPDisplaysDataType | tee "$RUNNER_TEMP/tour/displays-1x.txt"

      - name: Tour the windowed app with real input (1440x900)
        id: tour
        if: inputs.tours
        continue-on-error: true
        run: node native/macos/tour.mjs "$RUNNER_TEMP/out/Open Historia Native.app" "$RUNNER_TEMP/out/tour/Open Historia.pck" "$RUNNER_TEMP/tour/1x"

      - name: Add a virtual Retina display (1600x1000 points at 2x) and make it the main one
        id: retina
        if: inputs.tours
        continue-on-error: true
        run: |
          clang -fobjc-arc -O2 -framework Foundation -framework CoreGraphics native/macos/hidpi-display.m -o "$RUNNER_TEMP/hidpi-display"
          nohup "$RUNNER_TEMP/hidpi-display" 1600 1000 > "$RUNNER_TEMP/tour/hidpi-display.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/hidpi-display.pid"
          sleep 5
          cat "$RUNNER_TEMP/tour/hidpi-display.log"
          displayplacer list | tee "$RUNNER_TEMP/tour/displayplacer-retina.txt"
          node native/macos/display-setup.mjs retina 1600x1000 | tee "$RUNNER_TEMP/tour/display-setup-2x.txt"; test "${PIPESTATUS[0]}" = 0
          system_profiler SPDisplaysDataType | tee "$RUNNER_TEMP/tour/displays-2x.txt"

      - name: Tour again on the Retina display (or at an emulated 2x if no Retina display could be made)
        id: tour2x
        if: inputs.tours
        continue-on-error: true
        run: |
          if [ "${{ steps.retina.outcome }}" = success ]; then
            node native/macos/tour.mjs "$RUNNER_TEMP/out/Open Historia Native.app" "$RUNNER_TEMP/out/tour/Open Historia.pck" "$RUNNER_TEMP/tour/2x" --tag x2- --only menu,settings,history,game,gestures --skip notify,war --screens c-menu-games,c-hud,c-settings-general,c-ai-setup,g-2-shift-tilt
          else
            node native/macos/tour.mjs "$RUNNER_TEMP/out/Open Historia Native.app" "$RUNNER_TEMP/out/tour/Open Historia.pck" "$RUNNER_TEMP/tour/2x" --tag x2- --scale 2 --size 960x500 --only menu,settings,history,game --skip notify,war --screens c-menu-games,c-hud,c-settings-general
          fi

      - name: Remove the virtual display
        if: always() && inputs.tours
        continue-on-error: true
        run: |
          if [ -f "$RUNNER_TEMP/hidpi-display.pid" ]; then kill "$(cat "$RUNNER_TEMP/hidpi-display.pid")" 2>/dev/null || true; fi
          sleep 2
          displayplacer list 2>/dev/null | grep -E "^(Persistent screen id|Type|Resolution|Scaling):" || true

      - name: Read the notifications usernoted delivered
        if: always() && inputs.tours
        continue-on-error: true
        run: |
          log show --last 90m --style compact --predicate 'subsystem == "com.apple.UserNotifications" OR process == "usernoted"' 2>/dev/null | grep -i "openhistoria" | grep -iE "Adding|Added|Delivering|Presenting|scheduled|Authorization|Requested" | tail -60 | tee "$RUNNER_TEMP/tour/usernotifications.txt"
          grep -h "usernoted\|notifier smoke" "$RUNNER_TEMP/out/notifier-smoke.log" | tail -30 | tee "$RUNNER_TEMP/tour/notifier-smoke-usernoted.txt" || true

      - name: First open of the published zip (quarantine, Gatekeeper, the documented step)
        id: firstopen
        if: inputs.tours
        continue-on-error: true
        timeout-minutes: 15
        run: bash native/macos/first-open.sh "$RUNNER_TEMP/tour/first-open"

      - name: The self-updater leaves no quarantine behind (the updater tests on a real .app)
        id: updaterquarantine
        if: inputs.tours
        continue-on-error: true
        run: |
          node --test --test-reporter=spec --test-name-pattern "tools build|unquarantined" native/sidecar/test/update-mac.test.mjs 2>&1 | tee "$RUNNER_TEMP/tour/first-open/updater-quarantine.txt"; test "${PIPESTATUS[0]}" = 0
          grep -E "^ℹ (tests|pass|fail|skipped)" "$RUNNER_TEMP/tour/first-open/updater-quarantine.txt"
          ! grep -qE "^ℹ (pass 0|fail [1-9])" "$RUNNER_TEMP/tour/first-open/updater-quarantine.txt"

      - name: Compose the contact sheets
        if: always() && inputs.tours
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          for pass in 1x 2x; do
            if [ -d "$RUNNER_TEMP/tour/$pass/shots" ]; then "$RUNNER_TEMP/venv/bin/python" native/macos/contact-sheet.py "$RUNNER_TEMP/tour/$pass/shots" "$RUNNER_TEMP/tour/contact-sheet-$pass.png" "macOS $(sw_vers -productVersion) $(uname -m) tour $pass"; fi
          done
          cat "$RUNNER_TEMP"/tour/*/tour-*summary.json 2>/dev/null || true

      - name: Upload the tour
        if: always() && inputs.tours
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-macOS-tour
          path: ${{ runner.temp }}/tour
          retention-days: 1
          if-no-files-found: warn

      - name: Gather the smoke logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP"/out/*.log "$RUNNER_TEMP"/out/sidecar-smoke.json "$RUNNER_TEMP"/out/shell.txt "$RUNNER_TEMP/package.log" "$RUNNER_TEMP/sidecar-tests.log" "$RUNNER_TEMP/logs/" 2>/dev/null || true
          grep -h "smoke summary\|avif smoke\|notifier smoke" "$RUNNER_TEMP"/logs/*.log 2>/dev/null | tee "$RUNNER_TEMP/logs/summary.txt" || true
          ls -la "$RUNNER_TEMP"/out || true

      - name: Stop here if the sidecar tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::the sidecar tests failed; see sidecar-tests.log in the smoke logs"
          exit 1

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-macOS
          path: |
            ${{ runner.temp }}/out/Open-Historia-Native-macOS.zip
            ${{ runner.temp }}/out/Open-Historia-Native-macOS.dmg
            ${{ runner.temp }}/out/native-latest-mac.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload the update chunks
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-macOS-chunks
          path: ${{ runner.temp }}/out/chunks
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      # Only the Intel Mac job reads it, and that runs with the tours.
      - name: Upload the probe pack
        if: inputs.tours
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-macOS-probe
          path: ${{ runner.temp }}/out/probe
          retention-days: 1
          if-no-files-found: error

      - name: Upload the smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-macOS-smoke-logs
          path: ${{ runner.temp }}/logs
          retention-days: 3
          if-no-files-found: warn

      - name: Stop here if a desktop check failed
        if: always() && inputs.tours
        run: |
          echo "tour 1x: ${{ steps.tour.outcome }}"
          echo "tour 2x: ${{ steps.tour2x.outcome }}"
          echo "first open: ${{ steps.firstopen.outcome }}"
          echo "updater quarantine: ${{ steps.updaterquarantine.outcome }}"
          test "${{ steps.tour.outcome }}" = success && test "${{ steps.tour2x.outcome }}" = success && test "${{ steps.firstopen.outcome }}" = success && test "${{ steps.updaterquarantine.outcome }}" = success

  intel:
    name: Smoke-test on an Intel Mac
    needs: macos
    if: inputs.tours
    runs-on: macos-15-intel
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: native/macos

      - uses: actions/download-artifact@v4
        with:
          name: Open-Historia-Native-macOS
          path: ${{ runner.temp }}/app

      - uses: actions/download-artifact@v4
        with:
          name: Open-Historia-Native-macOS-probe
          path: ${{ runner.temp }}/probe

      - name: Unpack the app
        run: |
          ditto -x -k "$RUNNER_TEMP/app/Open-Historia-Native-macOS.zip" "$RUNNER_TEMP/unpacked"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/unpacked/Open Historia Native.app"

      - name: Smoke-test the app headless (Intel)
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          "$RUNNER_TEMP/unpacked/Open Historia Native.app/Contents/Resources/app/runtime/node" native/macos/smoke-mac.mjs "$RUNNER_TEMP/unpacked/Open Historia Native.app" "$RUNNER_TEMP/probe/Open Historia.pck" "$RUNNER_TEMP/logs/smoke-intel-headless.log"

      - name: Upload the smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-macOS-smoke-intel
          path: ${{ runner.temp }}/logs
          retention-days: 1
          if-no-files-found: warn

  linux:
    name: Build and smoke-test the Linux app
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ inputs.tours && 90 || 60 }}
    concurrency:
      group: native-release-${{ github.ref }}-linux
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the build and display tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build nasm cmake pkg-config zlib1g-dev xvfb xauth libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libxkbcommon-x11-0 libxext6 libxrender1 libdbus-1-3 fontconfig fonts-dejavu-core libfontconfig1 libwebkit2gtk-4.1-dev patchelf openbox dunst libnotify-bin dbus-x11 x11-utils xdotool imagemagick desktop-file-utils xdg-utils python3-venv fonts-liberation fonts-noto-color-emoji >/dev/null
          meson --version; ninja --version; nasm --version; cmake --version | head -1; ldd --version | head -1

      # As on the Mac: the engine's outputs are kept by the hash of what they are
      # built from, and an unchanged engine skips the Rust build.
      - name: Restore the engine build for this source
        id: engine
        uses: actions/cache/restore@v4
        with:
          path: |
            native/engine/target/release/liboh_gdext.so
            native/engine/target/release/libohweb.so
            native/engine/target/release/ohfronts-host
          key: engine-linux-x86_64-ubuntu-22.04-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('native/engine/Cargo.lock', 'native/engine/Cargo.toml', 'native/engine/rust-toolchain.toml', 'native/engine/crates/**') }}

      - name: Install the Rust toolchain
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup show

      - uses: Swatinem/rust-cache@v2
        if: steps.engine.outputs.cache-hit != 'true'
        with:
          workspaces: native/engine -> target
          key: linux-x86_64
          cache-on-failure: true

      - name: Build the engine library
        if: steps.engine.outputs.cache-hit != 'true'
        working-directory: native/engine
        run: |
          cargo build -p oh_gdext -p ohweb --release
          cargo build -p ohfronts --bin ohfronts-host --release

      - name: Check the engine library and the front engine
        working-directory: native/engine
        run: |
          echo "engine build restored from the cache: ${{ steps.engine.outputs.cache-hit == 'true' }}"
          file target/release/ohfronts-host
          echo '{"t":"ping","id":1}' | target/release/ohfronts-host | grep -q '"t":"pong"'
          file target/release/liboh_gdext.so target/release/libohweb.so
          objdump -T target/release/liboh_gdext.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          objdump -p target/release/liboh_gdext.so | grep NEEDED
          objdump -p target/release/libohweb.so | grep NEEDED
          if objdump -p target/release/liboh_gdext.so | grep NEEDED | grep -qiE 'webkit|gtk|soup'; then echo "::error::liboh_gdext.so must not link WebKitGTK; the web view lives in libohweb.so"; exit 1; fi
          ls -la target/release/liboh_gdext.so target/release/libohweb.so

      - name: Keep the engine build for the next push
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            native/engine/target/release/liboh_gdext.so
            native/engine/target/release/libohweb.so
            native/engine/target/release/ohfronts-host
          key: ${{ steps.engine.outputs.cache-primary-key }}

      - name: Restore the AVIF reader's libraries from the cache
        id: codec-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/imagecodec-build/prefix
          key: imagecodec-${{ runner.os }}-22.04-${{ hashFiles('native/linux/build-imagecodec.sh') }}

      - name: Build the AVIF reader (dav1d and libavif pinned by commit, linked in)
        run: |
          bash native/linux/build-imagecodec.sh "$HOME/imagecodec-build" "$RUNNER_TEMP/imagecodec/oh-imagecodec"
          echo "OH_IMAGECODEC_BIN=$RUNNER_TEMP/imagecodec/oh-imagecodec" >> "$GITHUB_ENV"

      - name: Save the AVIF reader's libraries to the cache
        if: steps.codec-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/imagecodec-build/prefix
          key: imagecodec-${{ runner.os }}-22.04-${{ hashFiles('native/linux/build-imagecodec.sh') }}

      - name: Read the Godot checksums
        id: godot
        run: |
          curl -fsSL "$GODOT_BASE/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot-sums.txt"
          editor=$(awk '$2 == "Godot_v4.7.2-stable_linux.x86_64.zip" {print $1}' "$RUNNER_TEMP/godot-sums.txt")
          templates=$(awk '$2 == "Godot_v4.7.2-stable_export_templates.tpz" {print $1}' "$RUNNER_TEMP/godot-sums.txt")
          test ${#editor} -eq 128 && test ${#templates} -eq 128
          echo "editor=$editor" >> "$GITHUB_OUTPUT"
          echo "templates=$templates" >> "$GITHUB_OUTPUT"
          echo "key=godot-linux-4.7.2-${editor:0:16}-${templates:0:16}" >> "$GITHUB_OUTPUT"

      - name: Restore Godot from the cache
        id: godot-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/godot-cache
          key: ${{ steps.godot.outputs.key }}

      - name: Download Godot and its Linux template (sha512 checked)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          EDITOR_SHA: ${{ steps.godot.outputs.editor }}
          TEMPLATES_SHA: ${{ steps.godot.outputs.templates }}
        run: |
          mkdir -p ~/godot-cache "$RUNNER_TEMP/godot-dl"
          cd "$RUNNER_TEMP/godot-dl"
          curl -fsSL --retry 3 "$GODOT_BASE/Godot_v4.7.2-stable_linux.x86_64.zip" -o editor.zip
          echo "$EDITOR_SHA  editor.zip" | sha512sum -c -
          curl -fsSL --retry 3 "$GODOT_BASE/Godot_v4.7.2-stable_export_templates.tpz" -o templates.tpz
          echo "$TEMPLATES_SHA  templates.tpz" | sha512sum -c -
          unzip -q -o editor.zip -d ~/godot-cache
          unzip -q -j templates.tpz templates/linux_release.x86_64 templates/version.txt -d ~/godot-cache
          chmod +x ~/godot-cache/Godot_v4.7.2-stable_linux.x86_64 ~/godot-cache/linux_release.x86_64
          cat ~/godot-cache/version.txt
          rm -rf "$RUNNER_TEMP/godot-dl"

      - name: Save Godot to the cache
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/godot-cache
          key: ${{ steps.godot.outputs.key }}

      - name: Check the Godot tools
        run: |
          ls -la ~/godot-cache
          echo "OH_GODOT_EDITOR=$HOME/godot-cache/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "OH_GODOT_TEMPLATE=$HOME/godot-cache/linux_release.x86_64" >> "$GITHUB_ENV"
          "$HOME/godot-cache/Godot_v4.7.2-stable_linux.x86_64" --headless --version

      - name: Download node for Linux (sha256 checked)
        run: |
          mkdir -p "$RUNNER_TEMP/node" && cd "$RUNNER_TEMP/node"
          name="node-v$NODE_VERSION-linux-x64.tar.xz"
          curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/SHASUMS256.txt" -o SHASUMS256.txt
          curl -fsSL --retry 3 "https://nodejs.org/dist/v$NODE_VERSION/$name" -o "$name"
          grep "  $name\$" SHASUMS256.txt | sha256sum -c -
          echo "$NODE_LINUX_SHA256  $name" | sha256sum -c -
          tar -xJf "$name"
          "./node-v$NODE_VERSION-linux-x64/bin/node" --version
          echo "OH_NODE_BIN=$RUNNER_TEMP/node/node-v$NODE_VERSION-linux-x64/bin/node" >> "$GITHUB_ENV"

      - name: Install the server packages and the map generator
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/fetch-fmg.mjs --required

      - name: Install the sidecar packages and check the linux-x64 node-datachannel build against the lockfile
        working-directory: native/sidecar
        run: |
          npm ci --no-audit --no-fund --onnxruntime-node-install=skip
          target="node_modules/@node-datachannel/linux-x64-gnu"
          version=$(node -p 'require("./package-lock.json").packages["node_modules/@node-datachannel/linux-x64-gnu"].version')
          want=$(node -p 'require("./package-lock.json").packages["node_modules/@node-datachannel/linux-x64-gnu"].integrity')
          tarball=$(npm pack "@node-datachannel/linux-x64-gnu@$version" --pack-destination "$RUNNER_TEMP" --silent)
          got="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/$tarball" | base64 -w0)"
          test "$got" = "$want" || { echo "integrity mismatch for linux-x64-gnu: $got"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ndc" && tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/ndc" --strip-components=1
          cmp "$RUNNER_TEMP/ndc/node_datachannel.node" "$target/node_datachannel.node"
          file "$target/node_datachannel.node"
          ls node_modules/@node-datachannel
          echo "lockfile linux-x64-gnu $version $want"

      - name: Run the sidecar tests
        id: tests
        continue-on-error: true
        run: |
          cp "$OH_IMAGECODEC_BIN" native/sidecar/imagecodec/oh-imagecodec
          for test in native/sidecar/test/*.test.mjs; do
            echo "::group::$test"
            node --test --test-reporter=spec "$test" 2>&1 | tee -a "$RUNNER_TEMP/sidecar-tests.log"
            echo "::endgroup::"
          done
          rm -f native/sidecar/imagecodec/oh-imagecodec
          grep -E "^ℹ (tests|pass|fail|skipped)|^✔|^✖|﹣" "$RUNNER_TEMP/sidecar-tests.log" | tail -80 || true
          ! grep -qE "^ℹ fail [1-9]" "$RUNNER_TEMP/sidecar-tests.log"

      - name: Build and package the app
        run: node native/package-linux.mjs "$RUNNER_TEMP/out" --probe 2>&1 | tee "$RUNNER_TEMP/package.log"; test "${PIPESTATUS[0]}" = 0

      - name: Inspect the package
        run: |
          app="$RUNNER_TEMP/out/Open Historia Native"
          ls -la "$app" "$app/runtime" "$app/native/sidecar/imagecodec"
          for bin in "$app/runtime/Open Historia.x86_64" "$app/runtime/liboh_gdext.so" "$app/runtime/libohweb.so" "$app/runtime/node" "$app/native/sidecar/imagecodec/oh-imagecodec" "$app/native/sidecar/ohfronts/ohfronts-host" "$app/native/sidecar/node_modules/@node-datachannel/linux-x64-gnu/node_datachannel.node"; do
            file "$bin"
            echo "  needs $(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          done
          head -3 "$app/open-historia-native"
          cat "$app/open-historia-native.desktop"
          cat "$app/native/godot/version.json"
          du -sh "$app" "$RUNNER_TEMP/out/chunks" "$RUNNER_TEMP"/out/*.tar.gz "$RUNNER_TEMP/out/probe"
          ls "$RUNNER_TEMP/out/chunks" | wc -l
          cat "$RUNNER_TEMP/out/native-latest-linux.json"

      - name: Unpack the archive as a player would and check the launcher
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/launcher-home"
          tar -xzf "$RUNNER_TEMP/out/Open-Historia-Native-Linux-x86_64.tar.gz" -C "$RUNNER_TEMP/unpacked"
          app="$RUNNER_TEMP/unpacked/Open Historia Native"
          test -x "$app/open-historia-native" && test -x "$app/runtime/Open Historia.x86_64" && test -x "$app/runtime/node" && test -x "$app/native/sidecar/imagecodec/oh-imagecodec" && test -x "$app/native/sidecar/ohfronts/ohfronts-host"
          HOME="$RUNNER_TEMP/launcher-home" XDG_DATA_HOME="$RUNNER_TEMP/launcher-home/share" timeout 60 "$app/open-historia-native" --headless --version
          cat "$RUNNER_TEMP/launcher-home/share/applications/io.github.arkniem.openhistoria.native.desktop"
          grep -q "^Exec=\"$app/open-historia-native\"$" "$RUNNER_TEMP/launcher-home/share/applications/io.github.arkniem.openhistoria.native.desktop"
          if command -v desktop-file-validate >/dev/null; then desktop-file-validate "$RUNNER_TEMP/launcher-home/share/applications/io.github.arkniem.openhistoria.native.desktop"; fi

      - name: Read the AVIF samples with the shipped helper
        run: |
          mkdir -p "$RUNNER_TEMP/avif" && cd "$RUNNER_TEMP/avif"
          curl -fsSL "$AVIF_SAMPLES/Link-U/kimono.avif" -o kimono.avif
          curl -fsSL "$AVIF_SAMPLES/Link-U/kimono.rotate90.avif" -o kimono.rotate90.avif
          curl -fsSL "$AVIF_SAMPLES/Microsoft/bbb_alpha_inverted.avif" -o bbb_alpha_inverted.avif
          curl -fsSL "$AVIF_SAMPLES/Netflix/avis/alpha_video.avif" -o alpha_video.avif
          sha256sum -c - <<'SUMS'
          c2da5892f6a72b509c702b1e42d89946708f1cbc60d9bd392edfebfb58612e9f  kimono.avif
          e609c14b5915c0bcfd8f041e2bc6e5df755c8a83c9ad2f95ca0b576625d730e9  kimono.rotate90.avif
          83d68084a93f043a89d10373f0ca26dafc988eec811b8076cabb2ff1580c1817  bbb_alpha_inverted.avif
          493d6325d1981f7c98074266f91c5119599271396f6e9a0670c16904ead9113d  alpha_video.avif
          SUMS
          stage="$RUNNER_TEMP/out/Open Historia Native"
          "$stage/runtime/node" "$GITHUB_WORKSPACE/native/macos/avif-smoke.mjs" "$stage" "$RUNNER_TEMP/avif" | tee "$RUNNER_TEMP/out/avif-smoke.log"; test "${PIPESTATUS[0]}" = 0

      - name: Smoke-test the app headless
        run: |
          node native/linux/smoke-linux.mjs "$RUNNER_TEMP/out/Open Historia Native" "$RUNNER_TEMP/out/probe/Open Historia.pck" "$RUNNER_TEMP/out/smoke-headless.log"

      - name: Smoke-test the app in a window under Xvfb
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1440x900x24" node native/linux/smoke-linux.mjs "$RUNNER_TEMP/out/Open Historia Native" "$RUNNER_TEMP/out/probe/Open Historia.pck" "$RUNNER_TEMP/out/smoke-windowed.log" --windowed

      - name: Smoke-test the browser fallback when WebKitGTK is missing
        run: |
          mkdir -p "$RUNNER_TEMP/nowebkit"
          cp "$RUNNER_TEMP/out/Open Historia Native/runtime/libohweb.so" "$RUNNER_TEMP/nowebkit/libohweb.so"
          patchelf --replace-needed libwebkit2gtk-4.1.so.0 libwebkit2gtk-4.1-not-installed.so.0 "$RUNNER_TEMP/nowebkit/libohweb.so"
          objdump -p "$RUNNER_TEMP/nowebkit/libohweb.so" | grep NEEDED | grep webkit
          OH_PROBE_HOLD=2 OH_WEBPANEL_LIB="$RUNNER_TEMP/nowebkit/libohweb.so" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1440x900x24" node native/linux/smoke-linux.mjs "$RUNNER_TEMP/out/Open Historia Native" "$RUNNER_TEMP/out/probe/Open Historia.pck" "$RUNNER_TEMP/out/smoke-no-webkit.log" --windowed --webpanel unavailable
          grep "WEBPANEL" "$RUNNER_TEMP/out/smoke-no-webkit.log"

      - name: Check the desktop entry the launcher writes, and its icon
        id: desktop
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/tour"
          entry="$RUNNER_TEMP/launcher-home/share/applications/io.github.arkniem.openhistoria.native.desktop"
          {
            echo "\$ desktop-file-validate $(basename "$entry")"
            desktop-file-validate "$entry" 2>&1; echo "(exit $?)"
            echo
            cat "$entry"
            echo
            icon=$(sed -n 's/^Icon=//p' "$entry")
            echo "Icon=$icon"
            file "$icon"
            identify "$icon" 2>/dev/null || true
          } | tee "$RUNNER_TEMP/tour/desktop-entry.txt"
          desktop-file-validate "$entry"
          test -z "$(desktop-file-validate "$entry" 2>&1 | grep -i 'error')"
          icon=$(sed -n 's/^Icon=//p' "$entry")
          case "$icon" in /*) test -s "$icon" && file "$icon" | grep -q "PNG image data, 512 x 512" ;; *) XDG_DATA_HOME="$RUNNER_TEMP/launcher-home/share" python3 -c "import sys,gi; gi.require_version('Gtk','3.0'); from gi.repository import Gtk; i=Gtk.IconTheme.get_default().lookup_icon(sys.argv[1],512,0); print(i.get_filename()); sys.exit(0 if i else 1)" "$icon" ;; esac
          grep -q "^StartupWMClass=Open Historia$" "$entry"

      - name: Tour the windowed app with real input and a real notification (Xvfb, openbox, dunst, dbus-monitor)
        id: tour
        if: inputs.tours
        continue-on-error: true
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- bash native/linux/tour-session.sh "$RUNNER_TEMP/out/Open Historia Native" "$RUNNER_TEMP/out/tour/Open Historia.pck" "$RUNNER_TEMP/tour/1x"

      - name: Tour again at 2x (Retina-style, emulated)
        id: tour2x
        if: inputs.tours
        continue-on-error: true
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 3000x1900x24" dbus-run-session -- bash native/linux/tour-session.sh "$RUNNER_TEMP/out/Open Historia Native" "$RUNNER_TEMP/out/tour/Open Historia.pck" "$RUNNER_TEMP/tour/2x" --tag x2- --scale 2 --only menu,settings,history,game --skip notify,war,gestures --screens c-menu-games,c-hud,c-settings-general

      - name: Compose the contact sheets
        if: always() && inputs.tours
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          for pass in 1x 2x; do
            if [ -d "$RUNNER_TEMP/tour/$pass/shots" ]; then "$RUNNER_TEMP/venv/bin/python" native/macos/contact-sheet.py "$RUNNER_TEMP/tour/$pass/shots" "$RUNNER_TEMP/tour/contact-sheet-$pass.png" "Ubuntu 22.04 Xvfb tour $pass"; fi
          done
          cat "$RUNNER_TEMP"/tour/*/tour-*summary.json "$RUNNER_TEMP"/tour/1x/notification-*evidence.txt 2>/dev/null || true

      - name: Upload the tour
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-Linux-tour
          path: ${{ runner.temp }}/tour
          retention-days: 1
          if-no-files-found: warn

      - name: Gather the logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP"/out/*.log "$RUNNER_TEMP"/out/sidecar-smoke.json "$RUNNER_TEMP/package.log" "$RUNNER_TEMP/sidecar-tests.log" "$RUNNER_TEMP/logs/" 2>/dev/null || true
          grep -h "smoke summary\|avif smoke" "$RUNNER_TEMP"/logs/*.log 2>/dev/null | tee "$RUNNER_TEMP/logs/summary.txt" || true
          ls -la "$RUNNER_TEMP"/out || true

      - name: Stop here if the sidecar tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::the sidecar tests failed; see sidecar-tests.log in the logs"
          exit 1

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-Linux
          path: |
            ${{ runner.temp }}/out/Open-Historia-Native-Linux-x86_64.tar.gz
            ${{ runner.temp }}/out/native-latest-linux.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload the update chunks
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-Linux-chunks
          path: ${{ runner.temp }}/out/chunks
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      # Nothing downstream reads it; kept for the runs with the tours.
      - name: Upload the probe pack
        if: inputs.tours
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-Linux-probe
          path: ${{ runner.temp }}/out/probe
          retention-days: 1
          if-no-files-found: error

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-Linux-logs
          path: ${{ runner.temp }}/logs
          retention-days: 3
          if-no-files-found: warn

      - name: Stop here if a desktop check failed
        if: always()
        run: |
          echo "desktop entry: ${{ steps.desktop.outcome }}"
          echo "tour 1x: ${{ steps.tour.outcome }}"
          echo "tour 2x: ${{ steps.tour2x.outcome }}"
          test "${{ steps.desktop.outcome }}" = success
          if [ "${{ inputs.tours }}" = true ]; then test "${{ steps.tour.outcome }}" = success && test "${{ steps.tour2x.outcome }}" = success; fi

  android-node:
    name: Node for Android (${{ matrix.abi }})
    if: (github.event_name == 'push' && github.repository == 'Open-Historia/open-historia') || (github.event_name == 'workflow_dispatch' && inputs.android)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    concurrency:
      group: native-android-node-${{ matrix.abi }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: native/android/node

      - name: Look for Node for Android in the cache
        id: node-cache
        uses: actions/cache/restore@v4
        with:
          path: native/android/node/out/${{ matrix.abi }}
          key: node-android-v${{ env.NODE_VERSION }}-${{ matrix.abi }}-${{ hashFiles('native/android/node/build.sh', 'native/android/node/patch_node.py') }}
          lookup-only: true

      - name: Build Node for Android with the NDK (only when the cache missed)
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
          mkdir -p "$RUNNER_TEMP/node-work" native/android/node/out
          docker run --rm -e NODE_VERSION="v$NODE_VERSION" \
            -v "$RUNNER_TEMP/node-work:/work" \
            -v "$PWD/native/android/node:/build:ro" \
            -v "$PWD/native/android/node/out:/out" \
            ubuntu:22.04 bash /build/build.sh "${{ matrix.abi }}" "$(nproc)"
          sudo chown -R "$(id -u):$(id -g)" native/android/node/out

      - name: Check the build
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: |
          ls -la "native/android/node/out/${{ matrix.abi }}"
          file "native/android/node/out/${{ matrix.abi }}/node.stripped"
          test "$(cat "native/android/node/out/${{ matrix.abi }}/VERSION")" = "v$NODE_VERSION"

      - name: Save Node for Android to the cache
        if: steps.node-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native/android/node/out/${{ matrix.abi }}
          key: node-android-v${{ env.NODE_VERSION }}-${{ matrix.abi }}-${{ hashFiles('native/android/node/build.sh', 'native/android/node/patch_node.py') }}

  android:
    name: Build the Android app
    needs: android-node
    if: (github.event_name == 'push' && github.repository == 'Open-Historia/open-historia') || (github.event_name == 'workflow_dispatch' && inputs.android)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    concurrency:
      group: native-release-${{ github.ref }}-android
      cancel-in-progress: true
    outputs:
      kind: ${{ steps.apks.outputs.kind }}
    defaults:
      run:
        shell: bash
    env:
      NDK_VERSION: 29.0.14206865
      ANDROID_BUILD_TOOLS: 36.1.0
      OH_ANDROID_CERT_SHA256: bb087cdd17aa83874e9c57ce9e48dac105050e91694008033558750e7009745a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the NDK and the Android platform
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platform-tools" "build-tools;$ANDROID_BUILD_TOOLS" "platforms;android-36" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk/$NDK_VERSION" "$ANDROID_HOME/platforms/android-36"

      - name: Install the Rust toolchain for Android
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-linux-android --target x86_64-linux-android
          rustup default "$RUST_TOOLCHAIN"
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo ndk --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/engine -> target
          key: android
          cache-on-failure: true

      - name: Read the Godot checksums
        id: godot
        run: |
          curl -fsSL "$GODOT_BASE/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot-sums.txt"
          editor=$(awk '$2 == "Godot_v4.7.2-stable_linux.x86_64.zip" {print $1}' "$RUNNER_TEMP/godot-sums.txt")
          templates=$(awk '$2 == "Godot_v4.7.2-stable_export_templates.tpz" {print $1}' "$RUNNER_TEMP/godot-sums.txt")
          test ${#editor} -eq 128 && test ${#templates} -eq 128
          echo "editor=$editor" >> "$GITHUB_OUTPUT"
          echo "templates=$templates" >> "$GITHUB_OUTPUT"
          echo "key=godot-android-gradle-4.7.2-${editor:0:16}-${templates:0:16}" >> "$GITHUB_OUTPUT"

      - name: Restore Godot from the cache
        id: godot-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/godot-cache
          key: ${{ steps.godot.outputs.key }}

      - name: Download Godot and its Android templates (sha512 checked)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          EDITOR_SHA: ${{ steps.godot.outputs.editor }}
          TEMPLATES_SHA: ${{ steps.godot.outputs.templates }}
        run: |
          mkdir -p ~/godot-cache "$RUNNER_TEMP/godot-dl"
          cd "$RUNNER_TEMP/godot-dl"
          curl -fsSL --retry 3 "$GODOT_BASE/Godot_v4.7.2-stable_linux.x86_64.zip" -o editor.zip
          echo "$EDITOR_SHA  editor.zip" | sha512sum -c -
          curl -fsSL --retry 3 "$GODOT_BASE/Godot_v4.7.2-stable_export_templates.tpz" -o templates.tpz
          echo "$TEMPLATES_SHA  templates.tpz" | sha512sum -c -
          unzip -q -o editor.zip -d ~/godot-cache
          unzip -q -j templates.tpz templates/android_debug.apk templates/android_release.apk templates/android_source.zip templates/version.txt -d ~/godot-cache
          chmod +x ~/godot-cache/Godot_v4.7.2-stable_linux.x86_64
          cat ~/godot-cache/version.txt
          rm -rf "$RUNNER_TEMP/godot-dl"

      - name: Save Godot to the cache
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/godot-cache
          key: ${{ steps.godot.outputs.key }}

      - name: Set Godot up for Android exports (templates, SDK, a throwaway debug key)
        run: |
          templates="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$templates" "$HOME/.config/godot"
          cp ~/godot-cache/android_debug.apk ~/godot-cache/android_release.apk ~/godot-cache/android_source.zip ~/godot-cache/version.txt "$templates/"
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          for name in editor_settings-4.7.tres editor_settings-4.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo
              echo '[resource]'
              echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
              echo "export/android/debug_keystore = \"$RUNNER_TEMP/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > "$HOME/.config/godot/$name"
          done
          echo "OH_GODOT_EXE=$HOME/godot-cache/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Restore Node for Android (arm64-v8a)
        uses: actions/cache/restore@v4
        with:
          path: native/android/node/out/arm64-v8a
          key: node-android-v${{ env.NODE_VERSION }}-arm64-v8a-${{ hashFiles('native/android/node/build.sh', 'native/android/node/patch_node.py') }}
          fail-on-cache-miss: true

      - name: Restore Node for Android (x86_64)
        uses: actions/cache/restore@v4
        with:
          path: native/android/node/out/x86_64
          key: node-android-v${{ env.NODE_VERSION }}-x86_64-${{ hashFiles('native/android/node/build.sh', 'native/android/node/patch_node.py') }}
          fail-on-cache-miss: true

      - name: Check Node for Android
        run: |
          for abi in arm64-v8a x86_64; do
            ls -la "native/android/node/out/$abi"
            test "$(cat "native/android/node/out/$abi/VERSION")" = "v$NODE_VERSION"
          done

      - name: Install the server and sidecar packages
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cd native/sidecar && npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the APKs (one per ABI; signed with the release key when it is set)
        id: apks
        env:
          KEYSTORE_B64: ${{ secrets.NATIVE_ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NATIVE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.NATIVE_ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            kind=release
            trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
            ( umask 077; printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks" )
            export OH_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
            export OH_ANDROID_BUILD=$(( ($(date -u +%s) - 1767225600) / 60 ))
            echo "versionCode $OH_ANDROID_BUILD"
            node native/android/build.mjs --abi arm64-v8a,x86_64 --godot "$OH_GODOT_EXE" --release
          else
            kind=debug
            echo "::notice::the NATIVE_ANDROID_* secrets are not set in this repository; debug APKs, nothing is published"
            node native/android/build.mjs --abi arm64-v8a,x86_64 --godot "$OH_GODOT_EXE"
          fi
          mkdir -p "$RUNNER_TEMP/android"
          for abi in arm64-v8a x86_64; do
            cp "native/android/out/open-historia-native-$abi-$kind.apk" "$RUNNER_TEMP/android/Open-Historia-Native-Android-$abi.apk"
          done
          ls -la "$RUNNER_TEMP/android"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Check the APKs are signed with the release key
        if: steps.apks.outputs.kind == 'release'
        run: |
          apksigner="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          for apk in "$RUNNER_TEMP"/android/*.apk; do
            "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
            cat "$RUNNER_TEMP/certs.txt"
            grep -qi "certificate SHA-256 digest: $OH_ANDROID_CERT_SHA256" "$RUNNER_TEMP/certs.txt" || { echo "::error::$(basename "$apk") is not signed with the release key"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Open-Historia-Native-Android${{ steps.apks.outputs.kind == 'debug' && '-debug' || '' }}
          path: ${{ runner.temp }}/android/*.apk
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  android-publish:
    name: Publish the Android app to Open-Historia/open-historia
    needs: android
    if: needs.android.outputs.kind == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: native-release-android-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: native

      - uses: actions/download-artifact@v4
        with:
          name: Open-Historia-Native-Android
          path: ${{ runner.temp }}/android

      - name: Publish the Android app (a dry run without the release token)
        id: publish
        env:
          RELEASE_TOKEN: ${{ secrets.OH_PUBLIC_RELEASE_TOKEN || (github.repository == 'Open-Historia/open-historia' && github.token || '') }}
          LAB_TOKEN: ${{ github.token }}
          WANTED: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          mode=--dry-run
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::notice::OH_PUBLIC_RELEASE_TOKEN is not set in this repository; a dry run, nothing is published"
            export GH_TOKEN="$LAB_TOKEN"
          elif [ "$GITHUB_REF" != refs/heads/native ]; then
            echo "::notice::only native publishes; a dry run for $GITHUB_REF"
            export GH_TOKEN="$RELEASE_TOKEN"
          elif [ "$WANTED" != true ]; then
            echo "::notice::publishing was turned off for this run; a dry run"
            export GH_TOKEN="$RELEASE_TOKEN"
          else
            export GH_TOKEN="$RELEASE_TOKEN"
            mode=--publish
          fi
          bash native/android/publish.sh "$RUNNER_TEMP/android" "$mode"
          if [ "$mode" = --publish ]; then echo "published=true" >> "$GITHUB_OUTPUT"; fi

      - name: Drop this run's APKs from the artifact storage
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "Open-Historia-Native-Android") | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "removed $name from the artifact storage"
          done

  publish:
    name: Publish to Open-Historia/open-historia
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never cancelled by a newer push: the newer publish waits for this one.
    concurrency:
      group: native-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: native

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: Open-Historia-Native-Windows
          path: ${{ runner.temp }}/windows

      - uses: actions/download-artifact@v4
        with:
          name: Open-Historia-Native-Windows-chunks
          path: ${{ runner.temp }}/windows/chunks

      - uses: actions/download-artifact@v4
        with:
          name: Open-Historia-Native-macOS
          path: ${{ runner.temp }}/macos

      - uses: actions/download-artifact@v4
        with:
          name: Open-Historia-Native-macOS-chunks
          path: ${{ runner.temp }}/macos/chunks

      - uses: actions/download-artifact@v4
        with:
          name: Open-Historia-Native-Linux
          path: ${{ runner.temp }}/linux

      - uses: actions/download-artifact@v4
        with:
          name: Open-Historia-Native-Linux-chunks
          path: ${{ runner.temp }}/linux/chunks

      - name: Publish the Windows, macOS and Linux apps (a dry run without the release token)
        id: publish
        env:
          RELEASE_TOKEN: ${{ secrets.OH_PUBLIC_RELEASE_TOKEN || (github.repository == 'Open-Historia/open-historia' && github.token || '') }}
          LAB_TOKEN: ${{ github.token }}
          WANTED: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          ls -la "$RUNNER_TEMP/windows" "$RUNNER_TEMP/macos" "$RUNNER_TEMP/linux"
          mode=--dry-run
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::notice::OH_PUBLIC_RELEASE_TOKEN is not set in this repository; a dry run, nothing is published"
            export GH_TOKEN="$LAB_TOKEN"
          elif [ "$GITHUB_REF" != refs/heads/native ] && [ "$GITHUB_REF" != refs/heads/native/godot-app ]; then
            echo "::notice::only native publishes; a dry run for $GITHUB_REF"
            export GH_TOKEN="$RELEASE_TOKEN"
          elif [ "$WANTED" != true ]; then
            echo "::notice::publishing was turned off for this run; a dry run"
            export GH_TOKEN="$RELEASE_TOKEN"
          else
            export GH_TOKEN="$RELEASE_TOKEN"
            mode=--publish
          fi
          echo "::group::Windows"
          bash native/publish-release.sh "$RUNNER_TEMP/windows" "$mode"
          echo "::endgroup::"
          echo "::group::macOS"
          bash native/publish-release.sh "$RUNNER_TEMP/macos" --mac "$mode"
          echo "::endgroup::"
          echo "::group::Linux"
          bash native/publish-release.sh "$RUNNER_TEMP/linux" --linux "$mode"
          echo "::endgroup::"
          if [ "$mode" = --publish ]; then echo "published=true" >> "$GITHUB_OUTPUT"; fi

      # The artifact storage quota is counted by the hour. Once a build is up on
      # the public release, its installers and pieces are there, so this run's
      # copies come out of the artifact storage now instead of a day later. The
      # Linux app stays (the multiplayer guest workflow downloads it from the
      # newest green run), and so do the logs; a run with the tours keeps all of
      # it, as the Intel Mac job may still be reading the macOS app.
      - name: Drop this run's published files from the artifact storage
        if: steps.publish.outputs.published == 'true' && !inputs.tours
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | test("^Open-Historia-Native-(Windows|Windows-chunks|macOS|macOS-chunks|Linux-chunks)$")) | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "removed $name from the artifact storage"
          done

  prune-chunks:
    name: Remove the update pieces no feed names
    needs: publish
    if: ${{ needs.publish.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: native

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Remove the pieces and file lists no system's feed leads to
        env:
          GH_TOKEN: ${{ secrets.OH_PUBLIC_RELEASE_TOKEN || github.token }}
        run: node native/prune-chunks.mjs --prune
