# Runs the test suite on pull requests into beta, beta-stats-v2, or main, and
# on pushes to beta or beta-stats-v2, so failures surface before promotion —
# not first discovered when the desktop installer workflow refuses to build
# (its "Run the tests" step is this same `npm test`). Twice on 2026-09-15 a PR
# merged into beta with one failing source-text guard, and both times the next
# installer run was the thing that noticed.
#
# Like desktop-beta.yml, a pull_request run uses the copy of this file on the
# PR's BASE branch, so PRs into main only get it once main carries it too.
name: Tests

on:
  pull_request:
    branches:
      - beta
      - beta-stats-v2
      - main
  push:
    branches:
      - beta
      - beta-stats-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same step the installer workflows run before they build.
      - name: Run the tests
        run: npm test
