# Packaging config for the UNOFFICIAL beta build built from the Seventh-Dread-Beta
# branch. Used as `electron-builder --config electron-builder.beta.yml`; the `build`
# block in package.json is ignored when this is passed, so this file is a complete
# config rather than a patch, and the stable build's config stays untouched.
#
# What is deliberately different from package.json's `build`:
#   appId / productName  — a DIFFERENT application to Windows, macOS and Linux, so
#                          the beta installs BESIDE the official app instead of
#                          upgrading over it. Uninstalling one leaves the other.
#   artifactName         — a download nobody can confuse with the official one.
#   icon                 — the compass with a BETA banner, so the
#                          two are told apart in the Start Menu and on the taskbar,
#                          where the names are truncated but the icons are not.
#
# What tells the RUNNING app it is the beta is not here: it is electron/channel.json,
# stamped by scripts/stamp-channel.mjs (see `npm run dist:win:beta`). electron-builder's
# `extraMetadata` would have done the same job by editing the packaged package.json,
# but it gets there by rewriting the project's own package.json mid-build, which can
# leave the repo's copy stripped if a build is interrupted.
#
# What is deliberately the SAME: everything the game reads and writes. The beta
# gets its own userData from its own productName, but electron/main.cjs points
# the save library at the stable app's folder on purpose — see SHARED_LIBRARY_NAME.
# A DIFFERENT appId to the one the earlier `Open Historia Beta` build shipped with,
# on purpose: Windows keys the uninstall entry off it, so a new id makes this a new
# application that installs into the new folder below rather than upgrading the old
# beta in place and inheriting its recorded install path. Testers uninstall the old
# one by hand; if they don't, the two coexist harmlessly (libraryLock.cjs stops them
# writing the shared saves at once).
appId: io.github.seventhdread.openhistoria.sdbeta
# Deliberately WITHOUT parentheses. This name becomes the install folder, and
# electron-builder only uses productName for that when it matches its allow-list
# /^[-_+0-9a-zA-Z .]+$/ (targetUtil.ts, getWindowsInstallationDirName). Parentheses
# fail it, and the fallback is package.json's `name` — which would put the beta in
# …\Programs\open-historia: no mention of whose beta it is, and a name a future
# upstream change could plausibly want too. The parenthesised name still reaches the
# player through nsis.shortcutName, nsis.uninstallDisplayName and the window title.
productName: Open Historia SeventhDread Beta

files:
  - dist/**
  - server/**
  - electron/**
  - scripts/fetch-map-assets.mjs
  - scripts/map-assets.json
  - public/lang/**
  - package.json
  - "!**/*.map"

asarUnpack:
  - scripts/**

# Ad-hoc code-signs the packaged .app on macOS. Without it the build ships with
# only the stock Electron binary's linker signature and no sealed resources, and
# macOS refuses the quarantined download outright as "damaged" instead of showing
# the ordinary bypassable unsigned-app warning. See the script for the detail.
# The stable build sets the same hook in package.json's `build` block; --config
# replaces that block wholesale, so it has to be repeated here.
afterPack: ./scripts/mac-adhoc-sign.cjs

# The beta's own update feed, and the reason it needs one HERE rather than
# inheriting the stable app's. electron-builder turns this block into the
# app-update.yml it packs inside the build, and app-update.yml is the only thing
# electron-updater will read — so without a `publish` block the beta ships with no
# feed at all and cannot update itself. It cannot inherit the stable one either:
# package.json's `build` block holds that, and passing `--config` replaces that
# block wholesale instead of extending it (see the header of this file). Nor can
# electron-builder guess, because package.json carries no `repository` field.
#
# `generic` rather than `github`: the github provider resolves the newest release
# by the GitHub API, which is the STABLE release in this repo — it would walk beta
# testers straight onto the official app. A generic provider is a dumb URL prefix,
# so it only ever finds what this workflow put at the beta's own tag.
#
# The tag is FIXED and deliberately duplicates BETA_UPDATE_MANIFEST in
# electron/main.cjs, which hardcodes the same one. The two must agree: that URL is
# what shows the banner, this one is what installs the update behind it. The
# workflow's `tag` input deliberately does NOT reach either, so a one-off build
# published to a private tag still sends its tester back to the main beta line
# rather than stranding them on a feed nobody will update again.
#
# `channel: latest` matches the stable app's, which is safe because the two feeds
# sit at different tags: this writes latest.yml, latest-linux.yml and
# latest-mac.yml under the beta tag only, and never touches desktop-stable.
publish:
  - provider: generic
    url: https://github.com/Open-Historia/open-historia/releases/download/desktop-seventhdread-beta
    channel: latest

directories:
  output: release
  buildResources: build

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/beta-assets/icon-beta.png
  artifactName: Open-Historia-SeventhDread-Beta-Setup-${os}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Open Historia (SeventhDread Beta)
  # Without this, "Apps & features" falls back to productName and the parenthesised
  # name the player sees everywhere else would not match the entry they uninstall.
  uninstallDisplayName: Open Historia (SeventhDread Beta)
  artifactName: Open-Historia-SeventhDread-Beta-Setup.${ext}

mac:
  target:
    - target: zip
      arch:
        - x64
        - arm64
  icon: electron/beta-assets/icon-beta.png
  category: public.app-category.strategy-games
  artifactName: Open-Historia-SeventhDread-Beta-mac-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: electron/beta-assets/icon-beta.png
  category: Game
  artifactName: Open-Historia-SeventhDread-Beta-${arch}.${ext}
