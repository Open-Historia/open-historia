<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Nothing is loaded from the network here, so lock the page down entirely. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Setting up Open Historia</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #131315;
        color: #f4ead0; font: 400 14px/1.5 system-ui, sans-serif; user-select: none;
      }
      .wrap { width: 100%; padding: 0 44px; text-align: left; }
      h1 { font-size: 1.15rem; font-weight: 700; margin: 0 0 6px; letter-spacing: .01em; }
      p { margin: 0; color: rgba(244, 234, 208, .62); font-size: .86rem; }
      .bar {
        height: 10px; margin: 22px 0 10px; border-radius: 99px; overflow: hidden;
        background: rgba(244, 234, 208, .12); border: 1px solid rgba(212, 175, 55, .3);
      }
      /* Width is the only thing that animates, so the bar stays smooth even while
         the download saturates the connection. */
      .bar > i { display: block; height: 100%; width: 0; border-radius: 99px;
        background: linear-gradient(180deg, #d4af37, #b8901f); transition: width .25s ease; }
      .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
      .pct { font-weight: 700; font-size: .86rem; color: #f4ead0; }
      .file { color: rgba(244, 234, 208, .5); font-size: .78rem;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .failed { margin-top: 14px; }
      .failed[hidden] { display: none; }
      .failed p + p { margin-top: 2px; }
      .actions { display: flex; gap: 10px; margin-top: 14px; }
      .actions button {
        font: 700 .82rem/1 system-ui, sans-serif; padding: 9px 14px; border-radius: 8px; cursor: pointer;
        color: #131315; background: linear-gradient(180deg, #d4af37, #b8901f); border: 1px solid #d4af37;
      }
      .actions button.quiet { color: #f4ead0; background: transparent; border-color: rgba(212, 175, 55, .3); }
      .actions button:disabled { opacity: .5; cursor: default; }
      .update { margin-top: 14px; }
      .update[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 id="title">Setting up Open Historia</h1>
      <p id="lede">Downloading the world map. This happens once — it is not downloaded again on future launches.</p>
      <div class="bar"><i id="fill"></i></div>
      <div class="row">
        <span class="pct" id="pct">Starting…</span>
        <span class="file" id="file"></span>
      </div>
      <div class="failed" id="failed" hidden>
        <p id="failedCount"></p>
        <p>Check your connection and try again, or continue without the map.</p>
        <div class="actions">
          <button type="button" id="retry">Try again</button>
          <button type="button" class="quiet" id="skip">Continue without the map</button>
        </div>
      </div>
      <div class="update" id="update" hidden>
        <p>Or play on this version now: the update then installs when you close the game.</p>
        <div class="actions">
          <button type="button" class="quiet" id="later">Open the game now</button>
        </div>
      </div>
    </div>
    <script>
      const fill = document.getElementById("fill");
      const pct = document.getElementById("pct");
      const file = document.getElementById("file");
      const failed = document.getElementById("failed");
      const failedCount = document.getElementById("failedCount");
      const retry = document.getElementById("retry");
      const skip = document.getElementById("skip");
      const title = document.getElementById("title");
      const lede = document.getElementById("lede");
      const update = document.getElementById("update");
      const later = document.getElementById("later");
      const mb = (n) => (n / 1e6).toFixed(0);

      // The same window shows two things: an update installing as the game opens
      // (electron/launchUpdate.cjs), then the map download when one is needed.
      const showMapDownload = () => {
        document.title = "Setting up Open Historia";
        title.textContent = "Setting up Open Historia";
        lede.textContent = "Downloading the world map. This happens once — it is not downloaded again on future launches.";
        update.hidden = true;
      };

      window.ohSetup.onUpdate(({ version, percent, installing, opening, failed: updateFailed }) => {
        document.title = "Updating Open Historia";
        title.textContent = "Updating Open Historia";
        lede.textContent = version
          ? `Version ${version} is downloading. The game opens on it as soon as it is installed — your games are kept.`
          : "A new version is downloading. The game opens on it as soon as it is installed — your games are kept.";
        file.textContent = "";
        if (opening) {
          update.hidden = true;
          pct.textContent = updateFailed ? "The update did not download. Opening the game…" : "Opening the game…";
          return;
        }
        const value = Math.max(0, Math.min(100, Number(percent) || 0));
        fill.style.width = `${value}%`;
        if (installing) {
          update.hidden = true;
          pct.textContent = "Installing — the game reopens by itself in a few seconds.";
          return;
        }
        pct.textContent = `${Math.round(value)}%`;
        update.hidden = false;
      });

      later.addEventListener("click", () => {
        later.disabled = true;
        pct.textContent = "Opening the game…";
        // The download may have finished a moment earlier, and with it the wait
        // for this button: nothing to tell then.
        window.ohSetup.updateLater().catch(() => {});
      });

      window.ohSetup.onProgress(({ asset, received, total }) => {
        showMapDownload();
        failed.hidden = true;
        const ratio = total > 0 ? Math.min(1, received / total) : 0;
        fill.style.width = `${(ratio * 100).toFixed(1)}%`;
        pct.textContent = `${Math.round(ratio * 100)}%  ·  ${mb(received)} / ${mb(total)} MB`;
        file.textContent = asset;
      });

      window.ohSetup.onDone(() => {
        failed.hidden = true;
        fill.style.width = "100%";
        pct.textContent = "Finishing up…";
        file.textContent = "";
      });

      window.ohSetup.onFailed(({ missing }) => {
        pct.textContent = "The download did not finish.";
        file.textContent = "";
        failedCount.textContent = missing === 1
          ? "1 map file could not be downloaded."
          : `${missing} map files could not be downloaded.`;
        retry.disabled = false;
        skip.disabled = false;
        failed.hidden = false;
      });

      const choose = (choice) => {
        retry.disabled = true;
        skip.disabled = true;
        if (choice === "retry") {
          failed.hidden = true;
          fill.style.width = "0";
          pct.textContent = "Starting…";
        }
        window.ohSetup.choose(choice);
      };
      retry.addEventListener("click", () => choose("retry"));
      skip.addEventListener("click", () => choose("continue"));
    </script>
  </body>
</html>
