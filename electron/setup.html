<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Nothing is loaded from the network here, so lock the page down entirely. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Setting up Open Historia</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #131315;
        color: #f4ead0; font: 400 14px/1.5 system-ui, sans-serif; user-select: none;
      }
      .wrap { width: 100%; padding: 0 44px; text-align: left; }
      h1 { font-size: 1.15rem; font-weight: 700; margin: 0 0 6px; letter-spacing: .01em; }
      p { margin: 0; color: rgba(244, 234, 208, .62); font-size: .86rem; }
      .bar {
        height: 10px; margin: 22px 0 10px; border-radius: 99px; overflow: hidden;
        background: rgba(244, 234, 208, .12); border: 1px solid rgba(212, 175, 55, .3);
      }
      /* Width is the only thing that animates, so the bar stays smooth even while
         the download saturates the connection. */
      .bar > i { display: block; height: 100%; width: 0; border-radius: 99px;
        background: linear-gradient(180deg, #d4af37, #b8901f); transition: width .25s ease; }
      .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
      .pct { font-weight: 700; font-size: .86rem; color: #f4ead0; }
      .file { color: rgba(244, 234, 208, .5); font-size: .78rem;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Setting up Open Historia</h1>
      <p>Downloading the world map. This happens once — it is not downloaded again on future launches.</p>
      <div class="bar"><i id="fill"></i></div>
      <div class="row">
        <span class="pct" id="pct">Starting…</span>
        <span class="file" id="file"></span>
      </div>
    </div>
    <script>
      const fill = document.getElementById("fill");
      const pct = document.getElementById("pct");
      const file = document.getElementById("file");
      const mb = (n) => (n / 1e6).toFixed(0);

      window.ohSetup.onProgress(({ asset, received, total }) => {
        const ratio = total > 0 ? Math.min(1, received / total) : 0;
        fill.style.width = `${(ratio * 100).toFixed(1)}%`;
        pct.textContent = `${Math.round(ratio * 100)}%  ·  ${mb(received)} / ${mb(total)} MB`;
        file.textContent = asset;
      });

      window.ohSetup.onDone(() => {
        fill.style.width = "100%";
        pct.textContent = "Finishing up…";
        file.textContent = "";
      });
    </script>
  </body>
</html>
