apply plugin: 'com.android.application'

// The channel: "stable" (the default) or "beta". The beta is a second app beside
// the stable one, as the desktop beta is: its own application id, so it installs
// next to the stable app instead of over it and keeps its own saves; its own
// name and icon (the placeholders in AndroidManifest.xml); and its own release
// and update feed (.github/workflows/android-apk-beta.yml, VITE_APP_TRACK=beta).
// server/androidBetaPackaging.test.js holds the pieces together.
def ohChannel = System.getenv("OH_ANDROID_CHANNEL") ?: "stable"
if (!(ohChannel in ["stable", "beta"])) {
    throw new GradleException("OH_ANDROID_CHANNEL is stable or beta, not " + ohChannel)
}
def ohBeta = ohChannel == "beta"

// The app's id: this, or this + ".beta" for the beta channel.
def ohAppId = "io.github.arkniem.openhistoria"

// The handover build. Until November 2026 the app had another id, and with it
// another sandbox: Android cannot update an installed app to a new id, and the
// new app cannot read the old one's saves. So the old id gets one more build of
// this same code, the handover, which tells the player about the new app,
// installs it beside itself and hands it every game and setting
// (SaveMovePlugin.java, src/runtime/native/appMove.js). It is made only when
// OH_ANDROID_LEGACY_APP_ID names the old stable id (CI reads it from a
// repository variable; the beta's old id is that + ".beta"), and the WebView
// address has to be the old one too (mobile/scripts/legacy-config.mjs).
// server/androidAppMove.test.js holds the pieces together.
def ohLegacyAppId = (System.getenv("OH_ANDROID_LEGACY_APP_ID") ?: "").trim()
if (ohLegacyAppId && !(ohLegacyAppId ==~ /[a-zA-Z]\w*(\.[a-zA-Z]\w*)+/)) {
    throw new GradleException("OH_ANDROID_LEGACY_APP_ID is not an application id: " + ohLegacyAppId)
}
if (ohLegacyAppId == ohAppId) {
    throw new GradleException("OH_ANDROID_LEGACY_APP_ID is the app's own id")
}
def ohSuffix = ohBeta ? ".beta" : ""
// What this build moves its saves to: the app's id in a handover build, "" in the app.
def ohMoveTo = ohLegacyAppId ? ohAppId + ohSuffix : ""

android {
    namespace "io.github.arkniem.openhistoria"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId((ohLegacyAppId ?: ohAppId) + ohSuffix)
        buildConfigField "String", "OH_MOVE_TO", "\"" + ohMoveTo + "\""
        // The file each app downloads once to be counted (AppFile.java); none
        // for a handover build, whose player is counted by the app it installs.
        buildConfigField "String", "OH_APP_FILE", "\"" + (ohLegacyAppId ? "" : ohBeta ? "android.beta.app.txt" : "android.app.txt") + "\""
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // From the workflow's run number (OH_ANDROID_BUILD), so every published
        // build is an upgrade over the last: Android refuses a lower versionCode,
        // and the in-app update banner compares the same number.
        versionCode = ((System.getenv("OH_ANDROID_BUILD") ?: "1") as Integer)
        versionName = "1.0." + (System.getenv("OH_ANDROID_BUILD") ?: "0") + (ohBeta ? "-beta" : "")
        manifestPlaceholders.putAll([
            appLabel: ohBeta ? "Open Historia Beta" : "Open Historia",
            appIcon: ohBeta ? "@mipmap/ic_launcher_beta" : "@mipmap/ic_launcher",
            appIconRound: ohBeta ? "@mipmap/ic_launcher_beta_round" : "@mipmap/ic_launcher_round",
            // The package the manifest asks to see (<queries>): the app, from a
            // handover build; the app itself otherwise, which changes nothing.
            ohMoveTo: ohMoveTo ?: ohAppId + ohSuffix,
        ])
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // The world map ships inside the APK (www/assets/*.pmtiles, laid there by
    // mobile/scripts/stage-www.mjs) and is read whole by the WebView, once per
    // archive: Capacitor's local server cannot answer a Range correctly
    // (src/runtime/wholeFileSource.js). The archives are stored as they are, so
    // that read is a straight copy rather than an inflate.
    androidResources {
        noCompress 'pmtiles'
    }
    // One keystore across builds, or an APK cannot install over its predecessor:
    // a fresh debug keystore on each CI runner is a different certificate. The
    // workflow decodes the secret to app/release.keystore and points
    // OH_ANDROID_KEYSTORE at it; without it the release type signs with the
    // debug key, which is what a local build gets.
    signingConfigs {
        release {
            def keystorePath = System.getenv("OH_ANDROID_KEYSTORE")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig System.getenv("OH_ANDROID_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
