# Open Historia — coturn, the TURN relay for multiplayer games © 2026 Nicholas Krol, AGPL-3.0-or-later (see LICENSE).
#
# TURN only, for WebRTC data channels between a game's host and its players.
# Every client connects TURN-only (iceTransportPolicy "relay"), so players
# never learn each other's addresses, and what the relay carries is DTLS it
# cannot read.
#
# Credentials are short-lived (coturn's "TURN REST API" scheme, see
# server-mp/src/turn.js): server-mp makes them with a shared secret, and coturn
# checks them with the same one. The secret is NOT in this file.
# docker-compose.yml appends
#     static-auth-secret=<TURN_SECRET>
#     external-ip=<TURN_EXTERNAL_IP>
#     allowed-peer-ip=<the public address in TURN_EXTERNAL_IP>
# to a private copy of this file when the container starts, from ops/.env.
# The secret must be the very TURN_SECRET that server-mp is given, or coturn
# refuses every credential server-mp hands out; both read it from the same
# ops/.env, so they agree.
#
# coturn reads options one per line; a comment must have a line of its own.

# --- Where it listens --------------------------------------------------------

# TURN over UDP and TCP.
listening-port=3478
# TURN over TLS ("turns:"), on its own port: 443 belongs to Caddy (see
# ops/README.md for what TURN on 443 would take).
tls-listening-port=5349

# Each allocation holds one port from this range. A browser makes one
# allocation per TURN URL it is given (up to three: UDP, TCP, TLS) at each end
# of a player's connection, so one connection can hold six ports: 16,384 ports
# is some 2,700 player connections, more than the bandwidth cap below lets
# through at once. Open the range (UDP) in the VM's firewall and in the
# cloud's security list.
min-port=49152
max-port=65535

# --- Who may use it: time-limited credentials, nothing else -------------------

use-auth-secret
realm=open-historia
server-name=open-historia
fingerprint
# A nonce lives ten minutes; a client re-authenticates after that.
stale-nonce=600
# Plain STUN binding requests must authenticate too, so the relay is not a
# public STUN server for anyone who finds it.
secure-stun

# --- TLS for turns: on 5349 ----------------------------------------------------

# Placeholders: ops/README.md says how the certificate Caddy obtains for the
# domain is copied here. Until the files exist, turns: does not work; leave
# the turns: URL out of TURN_URLS until then.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1
# TURN over DTLS: no browser uses it.
no-dtls

# --- How much it may carry ------------------------------------------------------

# Allocations per credential. server-mp hands out one credential per
# connection (a host asks for one for each player it answers), and a browser
# makes up to three allocations for a connection, one per TURN URL: six leaves
# room for an ICE restart that reuses the credential, and no more.
user-quota=6
# Allocations in all: no more than there are relay ports.
total-quota=16000
# Bytes a second per allocation, each way (about 2 Mbit/s): far more than a
# game's messages, and a big snapshot still arrives in seconds.
max-bps=250000
# Bytes a second for the whole relay, each way (about 24 Mbit/s): well inside
# an Always Free VM's network, and at most some 7.8 TB a month out, under
# Oracle's free 10 TB. Raise it with the VM.
bps-capacity=3000000

# --- What it may reach -------------------------------------------------------------
#
# A TURN server sends packets wherever its clients ask. Every player here is
# TURN-only, so the one address a relayed connection ever has to reach is this
# server's own public address, where the other end's allocation is. So all
# else is refused, and docker-compose.yml appends that one address at start-up
# (from TURN_EXTERNAL_IP) as
#     allowed-peer-ip=<the public address>
# (an address both allowed and denied counts as allowed). The relay is then of
# no use as a proxy to anywhere else: not the internet, not the VM's own
# services, not the cloud's metadata service. It does need the cloud to route
# the VM's packets to its own public address; ops/README.md shows how to check
# (turnutils_uclient -y).

# Only UDP is relayed (what WebRTC uses): no TCP connections out of the VM for
# anyone, to anything.
no-tcp-relay
no-multicast-peers
# Every IPv4 and IPv6 address, but for the one allowed at start-up.
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# And by name, so that they stay refused if the two lines above are ever
# loosened (to relay to peers elsewhere):
# 0.0.0.0/8: "this network" (0.0.0.0 itself can reach the VM's loopback)
denied-peer-ip=0.0.0.0-0.255.255.255
# 10.0.0.0/8: private, the VM's own cloud network among it
denied-peer-ip=10.0.0.0-10.255.255.255
# 100.64.0.0/10: carrier-grade NAT, and some clouds' internal addresses
denied-peer-ip=100.64.0.0-100.127.255.255
# 127.0.0.0/8: loopback
denied-peer-ip=127.0.0.0-127.255.255.255
# 169.254.0.0/16: link-local, where the cloud's metadata service answers
denied-peer-ip=169.254.0.0-169.254.255.255
# 172.16.0.0/12: private, Docker's networks among it
denied-peer-ip=172.16.0.0-172.31.255.255
# 192.0.0.0/24: IETF protocol assignments
denied-peer-ip=192.0.0.0-192.0.0.255
# 192.168.0.0/16: private
denied-peer-ip=192.168.0.0-192.168.255.255
# 198.18.0.0/15: benchmarking
denied-peer-ip=198.18.0.0-198.19.255.255
# ::1: IPv6 loopback
denied-peer-ip=::1
# fc00::/7: IPv6 unique local
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# fe80::/10: IPv6 link-local
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24: documentation
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
# 240.0.0.0/4 and broadcast: reserved
denied-peer-ip=240.0.0.0-255.255.255.255
# ::: IPv6 unspecified
denied-peer-ip=::
# ::ffff:0:0/96: IPv4-mapped IPv6, so no rule above can be walked around in IPv6
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
# 64:ff9b::/96: NAT64
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
# 100::/64: discard
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
# 2001:db8::/32: documentation
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff

# --- Everything else off ------------------------------------------------------------

no-cli
# No version in responses.
no-software-attribute
# No NAT-behaviour discovery (RFC 5780): nothing uses it, and it answers
# strangers.
no-rfc5780

# The container's filesystem is read-only; /tmp is its scratch space. coturn
# opens its user database even when, as here, no user is kept in it.
pidfile=/tmp/turnserver.pid
userdb=/tmp/turndb
# To the container's log (docker compose logs coturn), which Docker rotates.
# It names client addresses: see ops/README.md about keeping them.
log-file=stdout
simple-log
